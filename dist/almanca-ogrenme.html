<script>/* js/exercises/registry.js */
// Alıştırma kayıt defteri ve ortak arayüz parçaları.
// Her tip: render(ex, ctx) → HTMLElement. Kullanıcı cevap verince ctx.done(result) çağrılır:
//   result = { ok, level, given, expected, notes[], tags[], diff[], self? (öz-değerlendirme), word? }
(function (DE) {
  'use strict';

  var h = DE.util.h;
  var types = {};

  function register(type, impl) { types[type] = impl; }

  function render(ex, ctx) {
    var impl = types[ex.type];
    if (!impl) return h('div.card', 'Bilinmeyen alıştırma tipi: ' + ex.type);
    return impl.render(ex, ctx);
  }

  /** Artikel renkli kelime HTML'i: "der Tisch" */
  function wordEl(w, opts) {
    opts = opts || {};
    var el = h('span.word');
    if (w.art && opts.art !== false) el.appendChild(h('span.art.' + w.art, w.art));
    if (w.art && opts.art !== false) el.appendChild(document.createTextNode(' '));
    el.appendChild(h('span.de', w.de));
    return el;
  }

  /** Almanca metin girişi + ä ö ü ß tuşları. onSubmit(value) */
  function textInput(onSubmit, opts) {
    opts = opts || {};
    var input = h('input.answer', { type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, placeholder: opts.placeholder || 'Almanca yaz…', lang: 'de' });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); if (input.value.trim()) onSubmit(input.value); }
    });
    var keys = h('div.umlauts', ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].map(function (ch) {
      return h('button.key', {
        type: 'button', tabindex: -1,
        onmousedown: function (e) { e.preventDefault(); },
        onclick: function () { insertAt(input, ch); }
      }, ch);
    }));
    var submit = h('button.btn.primary', { type: 'button', onclick: function () { if (input.value.trim()) onSubmit(input.value); } }, 'Kontrol et');
    var wrap = h('div.input-wrap', input, keys, h('div.actions', submit));
    wrap.input = input;
    wrap.lock = function () { input.disabled = true; submit.disabled = true; keys.querySelectorAll('button').forEach(function (b) { b.disabled = true; }); };
    setTimeout(function () { input.focus(); }, 30);
    return wrap;
  }

  function insertAt(input, text) {
    var s = input.selectionStart == null ? input.value.length : input.selectionStart;
    var e = input.selectionEnd == null ? s : input.selectionEnd;
    input.value = input.value.slice(0, s) + text + input.value.slice(e);
    input.selectionStart = input.selectionEnd = s + text.length;
    input.focus();
  }

  /** Sonek kurallarından artikel ipucu (kurala uymayan kelimeler için null). */
  function articleRule(noun) {
    var n = noun.toLowerCase();
    var rules = [
      [/(ung|heit|keit|schaft|ion|tät|ik|ei|ur)$/, 'die', '-ung, -heit, -keit, -schaft, -ion, -tät, -ik, -ei ile biten isimler hep die'],
      [/(chen|lein)$/, 'das', '-chen ve -lein (küçültme) ile bitenler hep das'],
      [/(ment|um)$/, 'das', '-ment ve -um ile bitenler çoğunlukla das'],
      [/(ling|ismus|or)$/, 'der', '-ling, -ismus, -or ile bitenler çoğunlukla der']
    ];
    for (var i = 0; i < rules.length; i++) if (rules[i][0].test(n)) return { art: rules[i][1], text: rules[i][2] };
    return null;
  }

  /** Cevap sonrası geri bildirim kutusu. */
  function feedback(res, ex) {
    var cls = res.self ? 'neutral' : res.ok ? (res.level === 'minor' ? 'ok minor' : 'ok') : (res.level === 'partial' ? 'partial' : 'bad');
    var title = res.self ? '✓ Kaydedildi' : res.ok ? (res.level === 'minor' ? '✓ Doğru (küçük not var)' : '✓ Doğru!') : (res.level === 'partial' ? '≈ Neredeyse' : '✗ Yanlış');
    var box = h('div.feedback.' + cls.split(' ').join('.'), h('div.fb-title', title));
    if (!res.ok && res.expected) {
      box.appendChild(h('div.fb-expected', 'Doğrusu: ', h('b', { lang: 'de' }, res.expected), ' ', DE.audio.button(res.expected, { slow: false })));
    }
    if (!res.ok && res.diff && res.diff.length && res.given) {
      box.appendChild(h('div.diff', res.diff.map(function (d) { return h('span.' + d.op, d.t); })));
    }
    (res.notes || []).forEach(function (n) { box.appendChild(h('div.fb-note', n)); });
    if (ex && ex.explain && (!res.ok || res.level === 'minor' || ex.type === 'mcq')) box.appendChild(h('div.fb-explain', '💡 ', ex.explain));
    return box;
  }

  DE.exercises = { register: register, render: render, types: types, wordEl: wordEl, textInput: textInput, articleRule: articleRule, feedback: feedback };
})(window.DE = window.DE || {});

</script>
<script>/* js/exercises/choice.js */
// Seçmeli alıştırmalar: mcq, article, match.
(function (DE) {
  'use strict';

  var h = DE.util.h;
  var X = DE.exercises;

  // Çoktan seçmeli. Seçeneklerden biri ex.de ile aynıysa bu bir dinleme sorusudur:
  // Almanca metin gösterilmez, sadece seslendirilir.
  X.register('mcq', {
    render: function (ex, ctx) {
      var listening = ex.de && ex.options.some(function (o) { return DE.answer.normalize(o) === DE.answer.normalize(ex.de); });
      var order = DE.util.shuffle(ex.options.map(function (o, i) { return i; }));
      var answered = false;
      var el = h('div.ex.ex-mcq', h('div.q', ex.q));
      if (ex.de) {
        el.appendChild(listening
          ? h('div.listen-big', h('button.btn.big', { type: 'button', onclick: function () { DE.audio.speak(ex.de); } }, '🔊 Dinle'),
              h('button.btn.ghost', { type: 'button', onclick: function () { DE.audio.speak(ex.de, { slow: true }); } }, '🐢 Yavaş'))
          : h('div.de-line', { lang: 'de' }, ex.de, ' ', DE.audio.button(ex.de)));
        if (listening) setTimeout(function () { DE.audio.speak(ex.de); }, 250);
      }
      var opts = h('div.options');
      order.forEach(function (i, n) {
        var b = h('button.option', {
          type: 'button',
          onclick: function () {
            if (answered) return;
            answered = true;
            var ok = i === ex.answer;
            b.classList.add(ok ? 'right' : 'wrong');
            opts.children[order.indexOf(ex.answer)].classList.add('right');
            ctx.done({ ok: ok, level: ok ? 'exact' : 'wrong', given: ex.options[i], expected: ok ? null : ex.options[ex.answer], tags: [] });
          }
        }, h('span.kbd', String(n + 1)), ' ', ex.options[i]);
        opts.appendChild(b);
      });
      el.appendChild(opts);
      el.onKey = function (k) { var n = parseInt(k, 10); if (n >= 1 && n <= order.length) opts.children[n - 1].click(); };
      return el;
    }
  });

  X.register('article', {
    render: function (ex, ctx) {
      var w = DE.content.words[ex.word];
      if (!w) return h('div', 'Kelime bulunamadı: ' + ex.word);
      var answered = false;
      var el = h('div.ex.ex-article',
        h('div.q', 'Artikeli seç:'),
        h('div.big-word', { lang: 'de' }, h('span.blank-art', '___'), ' ', w.de, ' ', DE.audio.button(w.de, { slow: false })),
        h('div.muted', w.tr + (DE.store.state.settings.showEn && w.en ? ' · ' + w.en : '')));
      var row = h('div.options.row');
      ['der', 'die', 'das'].forEach(function (a, n) {
        row.appendChild(h('button.option.art-btn.' + a, {
          type: 'button',
          onclick: function (e) {
            if (answered) return;
            answered = true;
            var ok = a === w.art;
            e.currentTarget.classList.add(ok ? 'right' : 'wrong');
            el.querySelector('.blank-art').replaceWith(h('span.art.' + w.art, w.art));
            DE.audio.speak(w.art + ' ' + w.de);
            var notes = [];
            if (w.pl && w.pl !== '-') notes.push('Çoğul: die ' + w.pl);
            var rule = X.articleRule(w.de);
            if (rule && rule.art === w.art) notes.push('Kural: ' + rule.text + '.');
            ctx.done({ ok: ok, level: ok ? 'exact' : 'wrong', given: a + ' ' + w.de, expected: ok ? null : w.art + ' ' + w.de, notes: notes, tags: ok ? [] : ['article'], word: w.id });
          }
        }, h('span.kbd', String(n + 1)), ' ', a));
      });
      el.appendChild(row);
      el.onKey = function (k) { var n = parseInt(k, 10); if (n >= 1 && n <= 3) row.children[n - 1].click(); };
      return el;
    }
  });

  // Eşleştirme: soldan bir Almanca, sağdan bir Türkçe seç.
  X.register('match', {
    render: function (ex, ctx) {
      var left = DE.util.shuffle(ex.pairs.map(function (p, i) { return i; }));
      var right = DE.util.shuffle(ex.pairs.map(function (p, i) { return i; }));
      var sel = null, matched = 0, errors = 0;
      var el = h('div.ex.ex-match', h('div.q', ex.q || 'Eşleştir:'));
      var L = h('div.col'), R = h('div.col');
      left.forEach(function (i) {
        var b = h('button.option.small', { type: 'button', lang: 'de', onclick: function () {
          if (b.disabled) return;
          L.querySelectorAll('.sel').forEach(function (x) { x.classList.remove('sel'); });
          b.classList.add('sel'); sel = { i: i, b: b };
          DE.audio.speak(ex.pairs[i][0]);
        } }, ex.pairs[i][0]);
        L.appendChild(b);
      });
      right.forEach(function (i) {
        var b = h('button.option.small', { type: 'button', onclick: function () {
          if (b.disabled || !sel) return;
          if (sel.i === i) {
            sel.b.classList.remove('sel'); sel.b.classList.add('right'); b.classList.add('right');
            sel.b.disabled = true; b.disabled = true; sel = null; matched++;
            if (matched === ex.pairs.length) {
              var ok = errors <= 1;
              ctx.done({ ok: ok, level: ok ? 'exact' : 'wrong', notes: errors ? [errors + ' yanlış eşleştirme yaptın.'] : [], tags: ok ? [] : ['vocab'], given: errors + ' hata' });
            }
          } else {
            errors++;
            b.classList.add('wrong'); setTimeout(function () { b.classList.remove('wrong'); }, 500);
          }
        } }, ex.pairs[i][1]);
        R.appendChild(b);
      });
      el.appendChild(h('div.match-grid', L, R));
      return el;
    }
  });
})(window.DE = window.DE || {});

</script>
<script>/* js/exercises/text.js */
// Yazarak cevaplanan alıştırmalar: type (TR→DE), cloze (boşluk), listen (dikte), order (sıralama).
(function (DE) {
  'use strict';

  var h = DE.util.h;
  var X = DE.exercises;

  function finish(ctx, input, answers, extra) {
    var r = DE.answer.check(input, answers);
    r.given = input;
    if (extra) Object.assign(r, extra);
    ctx.done(r);
  }

  X.register('type', {
    render: function (ex, ctx) {
      var el = h('div.ex.ex-type', h('div.q', ex.q || 'Almancaya çevir:'));
      if (ex.tr) el.appendChild(h('div.tr-line', ex.tr));
      var inp = X.textInput(function (v) { inp.lock(); finish(ctx, v, ex.answers); });
      el.appendChild(inp);
      return el;
    }
  });

  X.register('cloze', {
    render: function (ex, ctx) {
      var parts = ex.de.split('___');
      var el = h('div.ex.ex-cloze', h('div.q', ex.q || 'Boşluğu doldur:'));
      var sentence = h('div.de-line.cloze', { lang: 'de' }, parts[0], h('span.gap', '…'), parts[1]);
      if (ex.hint) sentence.appendChild(h('span.hint', ' (' + ex.hint + ')'));
      el.appendChild(sentence);
      el.appendChild(h('div.tr-line', ex.tr));
      var inp = X.textInput(function (v) {
        inp.lock();
        var full = ex.answers.map(function (a) { return parts[0] + a + parts[1]; });
        // Boşluğa yazılanı tam cümle içinde değerlendir (ör. büyük harf, artikel teşhisi için).
        var r = DE.answer.check(parts[0] + v + parts[1], full);
        r.given = v;
        r.expected = r.ok ? null : ex.answers[0];
        sentence.querySelector('.gap').textContent = r.ok ? v : ex.answers[0];
        sentence.querySelector('.gap').classList.add(r.ok ? 'right' : 'wrong');
        ctx.done(r);
        DE.audio.speak(full[0]);
      }, { placeholder: 'Boşluğa gelen…' });
      el.appendChild(inp);
      return el;
    }
  });

  X.register('listen', {
    render: function (ex, ctx) {
      var el = h('div.ex.ex-listen', h('div.q', ex.q || 'Dinle ve duyduğunu yaz:'),
        h('div.listen-big',
          h('button.btn.big', { type: 'button', onclick: function () { DE.audio.speak(ex.de); } }, '🔊 Dinle'),
          h('button.btn.ghost', { type: 'button', onclick: function () { DE.audio.speak(ex.de, { slow: true }); } }, '🐢 Yavaş')));
      setTimeout(function () { DE.audio.speak(ex.de); }, 250);
      var inp = X.textInput(function (v) {
        inp.lock();
        finish(ctx, v, ex.answers && ex.answers.length ? ex.answers : [ex.de], { notes: [] });
        el.appendChild(h('div.tr-line', ex.de + ' — ' + ex.tr));
      });
      el.appendChild(inp);
      el.onKey = function (k) { if (k === ' ' && document.activeElement !== inp.input) DE.audio.speak(ex.de); };
      return el;
    }
  });

  // Kelime sıralama: karışık kelime kartlarına tıklayarak cümle kur.
  X.register('order', {
    render: function (ex, ctx) {
      var toks = ex.answer.trim().split(/\s+/).map(function (t) { return t.replace(/[.,!?]+$/, ''); });
      var pool = DE.util.shuffle(toks.concat(ex.extra || []).map(function (t, i) { return { t: t, i: i }; }));
      var picked = [];
      var el = h('div.ex.ex-order', h('div.q', ex.q || 'Cümleyi kur:'), h('div.tr-line', ex.tr));
      var line = h('div.order-line', { lang: 'de' });
      var bank = h('div.order-bank', { lang: 'de' });
      var check = h('button.btn.primary', { type: 'button', disabled: true }, 'Kontrol et');
      var locked = false;

      function draw() {
        line.innerHTML = ''; bank.innerHTML = '';
        picked.forEach(function (p, idx) {
          line.appendChild(h('button.chip', { type: 'button', onclick: function () { if (locked) return; picked.splice(idx, 1); draw(); } }, p.t));
        });
        pool.forEach(function (p) {
          var used = picked.indexOf(p) >= 0;
          bank.appendChild(h('button.chip' + (used ? '.used' : ''), { type: 'button', disabled: used || locked, onclick: function () { picked.push(p); DE.audio.speak(p.t); draw(); } }, p.t));
        });
        check.disabled = locked || picked.length === 0;
      }
      check.onclick = function () {
        locked = true; draw();
        var given = picked.map(function (p) { return p.t; }).join(' ');
        var r = DE.answer.check(given, [ex.answer].concat(ex.alt || []));
        if (r.level === 'minor') r.level = 'exact';
        r.given = given;
        ctx.done(r);
        DE.audio.speak(ex.answer);
      };
      el.appendChild(line); el.appendChild(bank); el.appendChild(h('div.actions', check));
      draw();
      return el;
    }
  });
})(window.DE = window.DE || {});

</script>
<script>/* js/exercises/produce.js */
// Serbest üretim: speak (dinle-tekrar et, kayıt, konuşma tanıma) ve write (yazma + yerel kontrol + yapay zekâya sor).
// İkisi de öz-değerlendirmelidir; ders puanına girmez.
(function (DE) {
  'use strict';

  var h = DE.util.h;
  var X = DE.exercises;

  X.register('speak', {
    render: function (ex, ctx) {
      var el = h('div.ex.ex-speak', h('div.q', ex.q || 'Dinle ve yüksek sesle tekrar et:'),
        h('div.de-line.big', { lang: 'de' }, ex.de, ' ', DE.audio.button(ex.de)),
        h('div.tr-line', ex.tr));
      setTimeout(function () { DE.audio.speak(ex.de); }, 250);

      var status = h('div.small.muted');
      var tools = h('div.row.wrap');

      // Kendi sesini kaydet → model sesle karşılaştır.
      var rec = DE.audio.recorder();
      if (rec.supported) {
        var recording = false, playback = h('div.row');
        var recBtn = h('button.btn', { type: 'button', onclick: function () {
          if (!recording) {
            rec.start().then(function () { recording = true; recBtn.textContent = '⏹ Durdur'; status.textContent = 'Kayıt yapılıyor… cümleyi söyle.'; })
              .catch(function (e) { status.textContent = 'Mikrofon açılamadı: ' + e.message; });
          } else {
            rec.stop().then(function (url) {
              recording = false; recBtn.textContent = '🎙 Tekrar kaydet'; status.textContent = 'Kendi sesini ve modeli sırayla dinle, farkı bul.';
              playback.innerHTML = '';
              playback.appendChild(h('button.btn.ghost', { type: 'button', onclick: function () { new Audio(url).play(); } }, '▶ Benim sesim'));
              playback.appendChild(h('button.btn.ghost', { type: 'button', onclick: function () { DE.audio.speak(ex.de); } }, '▶ Model'));
            });
          }
        } }, '🎙 Kaydet');
        tools.appendChild(recBtn);
        el.appendChild(playback);
      }

      // Konuşma tanıma (Chrome/Edge, ses Google/Microsoft sunucusuna gider → ayarlardan açılır).
      if (DE.audio.sttAvailable() && DE.store.state.settings.stt) {
        tools.appendChild(h('button.btn', { type: 'button', onclick: function () {
          status.textContent = '🎧 Dinliyorum… şimdi söyle.';
          DE.audio.listen().then(function (alts) {
            if (!alts.length) { status.textContent = 'Bir şey duyamadım, tekrar dene.'; return; }
            var best = alts.map(function (a) { return { a: a, s: DE.answer.overlap(a, ex.de) }; }).sort(function (x, y) { return y.s - x.s; })[0];
            var pct = Math.round(best.s * 100);
            status.innerHTML = '';
            status.appendChild(h('div', 'Anlaşılan: ', h('b', { lang: 'de' }, best.a)));
            status.appendChild(h('div', 'Anlaşılırlık: ' + pct + '% ' + (pct >= 90 ? '👍' : pct >= 60 ? '🙂 bazı kelimeler anlaşılmadı' : '— yavaş ve net tekrar dene')));
            status.appendChild(h('div.diff', DE.answer.diff(best.a, ex.de).map(function (d) { return h('span.' + d.op, d.t); })));
            status.appendChild(h('div.tiny.muted', 'Not: Bu skor telaffuzunun "anlaşılır" olup olmadığını ölçer; mükemmel telaffuzu değil.'));
          }).catch(function (e) { status.textContent = e.message; });
        } }, '🗣 Konuşma tanıma ile dene'));
      }

      el.appendChild(tools);
      el.appendChild(status);
      el.appendChild(h('div.actions',
        h('button.btn', { type: 'button', onclick: function () { ctx.done({ ok: true, self: true, level: 'exact', notes: ['Bu cümleyi ileride tekrar çalışacağız.'], selfGrade: 1 }); } }, 'Zorlandım'),
        h('button.btn.primary', { type: 'button', onclick: function () { ctx.done({ ok: true, self: true, level: 'exact', selfGrade: 3 }); } }, 'Söyledim ✓')));
      return el;
    }
  });

  /** Basit yerel yazma kontrolleri (öğretmen yokken ilk süzgeç). */
  function localChecks(text, ex) {
    var notes = [];
    var words = text.trim().split(/\s+/).filter(Boolean);
    if (ex.minWords && words.length < ex.minWords) notes.push('En az ' + ex.minWords + ' kelime yaz (şu an ' + words.length + ').');
    if (/[ışğİŞĞ]/.test(text)) notes.push('Türkçe harf (ı/ş/ğ) kullandın; Almancada yok.');
    var sentences = text.split(/(?<=[.!?])\s+/).filter(function (s) { return s.trim(); });
    sentences.forEach(function (s) {
      if (s[0] && s[0] !== s[0].toUpperCase()) notes.push('Cümle büyük harfle başlamalı: "' + s.slice(0, 20) + '…"');
    });
    if (text.trim() && !/[.!?]$/.test(text.trim())) notes.push('Son cümleyi nokta ile bitir.');
    // Bilinen isimler küçük harfle yazılmış mı?
    var nouns = {};
    Object.keys(DE.content.words).forEach(function (k) { var w = DE.content.words[k]; if (w.pos === 'n') nouns[w.de.toLowerCase()] = w.de; });
    var low = [];
    words.forEach(function (raw) {
      var t = raw.replace(/[.,!?;:]/g, '');
      if (t && t === t.toLowerCase() && nouns[t] && low.indexOf(nouns[t]) < 0) low.push(nouns[t]);
    });
    if (low.length) notes.push('İsimler büyük harfle yazılır: ' + low.join(', '));
    return notes;
  }

  X.register('write', {
    render: function (ex, ctx) {
      var lesson = ctx.lesson;
      var el = h('div.ex.ex-write', h('div.q', '✍️ Yazma görevi'), h('div.task', ex.task));
      if (ex.taskDe) el.appendChild(h('div.de-line.small', { lang: 'de' }, ex.taskDe));
      var ta = h('textarea.answer', { rows: 6, lang: 'de', spellcheck: false, placeholder: 'Almanca yaz…' });
      var count = h('div.tiny.muted', '0 kelime');
      ta.addEventListener('input', function () { count.textContent = ta.value.trim().split(/\s+/).filter(Boolean).length + ' kelime'; });
      var keys = h('div.umlauts', ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].map(function (ch) {
        return h('button.key', { type: 'button', tabindex: -1, onmousedown: function (e) { e.preventDefault(); }, onclick: function () {
          var s = ta.selectionStart, e2 = ta.selectionEnd; ta.value = ta.value.slice(0, s) + ch + ta.value.slice(e2); ta.selectionStart = ta.selectionEnd = s + 1; ta.focus();
        } }, ch);
      }));
      var result = h('div');
      var checkBtn = h('button.btn.primary', { type: 'button', onclick: function () {
        var text = ta.value.trim();
        if (!text) return;
        result.innerHTML = '';
        var notes = localChecks(text, ex);
        result.appendChild(h('div.feedback.' + (notes.length ? 'partial' : 'neutral'),
          h('div.fb-title', notes.length ? 'Otomatik kontrol: ' + notes.length + ' not' : 'Otomatik kontrolde sorun bulunmadı'),
          notes.map(function (n) { return h('div.fb-note', n); }),
          h('div.tiny.muted', 'Otomatik kontrol sadece temel şeylere bakar; gramer için aşağıdaki listeyi ve yapay zekâyı kullan.')));
        if (ex.checklist && ex.checklist.length) {
          result.appendChild(h('div.checklist', h('div.small', h('b', 'Kendini kontrol et:')),
            ex.checklist.map(function (c) { return h('label.check', h('input', { type: 'checkbox' }), ' ', c); })));
        }
        result.appendChild(h('details.model', h('summary', 'Örnek cevabı göster'), h('div.de-line', { lang: 'de' }, ex.model, ' ', DE.audio.button(ex.model))));
        result.appendChild(DE.ai.panel(DE.ai.writePrompt({ level: DE.ai.levelOf(lesson), task: ex.task, text: text }), 'Yapay zekâya düzelttir (isteğe bağlı)'));
        result.appendChild(h('div.actions', h('button.btn.primary', { type: 'button', onclick: function () {
          ctx.done({ ok: true, self: true, level: 'exact', given: text });
        } }, 'Bitti, devam')));
      } }, 'Kontrol et');
      el.appendChild(ta); el.appendChild(count); el.appendChild(keys);
      el.appendChild(h('div.actions', checkBtn));
      el.appendChild(result);
      el.noAutoFeedback = true;
      return el;
    }
  });

  X.localWriteChecks = localChecks;
})(window.DE = window.DE || {});

</script>

<script>/* js/views/lesson.js */
// Ders ve ünite testi oynatıcısı. Oturum durumu store.state.run'da tutulur: sekme kapansa da kaldığı yerden devam eder.
(function (DE) {
  'use strict';

  var h = DE.util.h;
  var X = DE.exercises;
  var RETRY_GAP = 3;

  function lessonOfExercise(id) {
    if (id.indexOf('auto:art:') === 0) { var w = DE.content.words[id.slice(9)]; return w && DE.content.lessonById[w.lessonId]; }
    if (id.indexOf('auto:match:') === 0) { var w2 = DE.content.words[id.slice(11).split(',')[0]]; return w2 && DE.content.lessonById[w2.lessonId]; }
    return DE.content.lessonById[id.replace(/\.e\d+$/, '')];
  }

  function newRun(mode, id) {
    var steps = mode === 'test' ? DE.planner.testSteps(DE.content.unitById[id]) : DE.planner.lessonSteps(DE.content.lessonById[id]);
    steps.push({ k: 'end' });
    return { type: mode, id: id, steps: steps, pos: 0, first: {}, retried: {}, wrongWords: {}, started: Date.now() };
  }

  function view(root, id, mode) {
    var S = DE.store.state;
    var isTest = mode === 'test';
    var lesson = isTest ? null : DE.content.lessonById[id];
    var unit = isTest ? DE.content.unitById[id] : lesson && DE.content.unitById[lesson.unitId];
    if (!unit) { root.appendChild(h('div.card', 'Bulunamadı: ' + id)); return; }

    var run = S.run;
    if (!run || run.type !== mode || run.id !== id) {
      if (run && run.pos > 0 && !confirm('Yarım kalan bir oturumun var (' + runTitle(run) + '). Onu bırakıp bunu başlatayım mı?')) {
        location.hash = run.type === 'test' ? '#/test/' + run.id : '#/lesson/' + run.id;
        return;
      }
      run = S.run = newRun(mode, id);
      DE.store.save();
    }

    var header = h('div.player-head',
      h('a.back', { href: '#/today', title: 'Çık (ilerleme kaydedilir)' }, '✕'),
      h('div.progress', h('div.bar')),
      h('div.small.muted.ptitle', isTest ? 'Ünite testi · ' + unit.title : unit.title + ' · ' + lesson.title));
    var stage = h('div.stage');
    root.appendChild(h('div.player', header, stage));

    var keyHandler = null;
    view.onKey = function (e) { if (keyHandler) keyHandler(e); };

    function setProgress() {
      header.querySelector('.bar').style.width = Math.round(100 * run.pos / Math.max(1, run.steps.length - 1)) + '%';
    }

    function next() {
      run.pos++;
      DE.store.save();
      show();
    }

    function continueBtn(label) {
      var b = h('button.btn.primary.wide', { type: 'button', onclick: next }, label || 'Devam ↵');
      keyHandler = function (e) { if (e.key === 'Enter' && !isTyping(e)) { e.preventDefault(); next(); } };
      setTimeout(function () { b.focus(); }, 20);
      return h('div.actions', b);
    }

    function show() {
      DE.audio.stop();
      setProgress();
      stage.innerHTML = '';
      keyHandler = null;
      var step = run.steps[run.pos];
      if (!step) { location.hash = '#/today'; return; }
      window.scrollTo(0, 0);
      if (step.k === 'intro') return showIntro();
      if (step.k === 'word') return showWord(DE.content.words[step.id]);
      if (step.k === 'grammar') return showGrammar(lesson.grammar[step.i]);
      if (step.k === 'culture') return showCulture();
      if (step.k === 'ex') return showExercise(step);
      if (step.k === 'end') return showEnd();
    }

    function showIntro() {
      var card = h('div.card');
      if (lesson.intro) card.appendChild(h('p.intro', lesson.intro));
      if (lesson.dialog) card.appendChild(dialogEl(lesson.dialog));
      stage.appendChild(card);
      stage.appendChild(continueBtn());
    }

    function showWord(w) {
      if (!w) return next();
      var showEn = S.settings.showEn;
      var card = h('div.card.word-card',
        h('div.tiny.muted', 'Yeni kelime'),
        h('div.big-word', { lang: 'de' }, X.wordEl(w), ' ', DE.audio.button((w.art ? w.art + ' ' : '') + w.de)),
        w.pos === 'n' && w.pl ? h('div.muted', w.pl === '-' ? 'Çoğulu yok' : (w.plOnly ? 'Sadece çoğul' : 'Çoğul: die ' + w.pl)) : null,
        h('div.meaning', w.tr, showEn && w.en ? h('span.en', ' · 🇬🇧 ' + w.en) : null),
        w.ex ? h('div.example', h('div', { lang: 'de' }, w.ex.de, ' ', DE.audio.button(w.ex.de)), h('div.muted', w.ex.tr)) : null,
        w.note ? h('div.note', '💡 ', w.note) : null,
        w.ff && showEn ? h('div.note.warn', '⚠️ ', w.ff) : null);
      if (w.art) {
        var rule = X.articleRule(w.de);
        if (rule && rule.art === w.art) card.appendChild(h('div.note', '🎯 ', rule.text));
      }
      stage.appendChild(card);
      stage.appendChild(continueBtn());
      DE.audio.speak((w.art ? w.art + ' ' : '') + w.de);
    }

    function showGrammar(g) {
      stage.appendChild(h('div.card.grammar', h('h2', '📘 ' + g.title), h('div.ghtml', { html: g.html })));
      // Gramer içindeki Almanca örnekleri tıklayınca seslendir.
      stage.querySelectorAll('.ghtml [lang=de], .ghtml td, .ghtml b').forEach(function (el) {
        if (/[A-Za-zÄÖÜäöüß]/.test(el.textContent) && el.textContent.length < 80) {
          el.classList.add('speakable');
          el.addEventListener('click', function () { DE.audio.speak(el.textContent); });
        }
      });
      stage.appendChild(continueBtn());
    }

    function showCulture() {
      stage.appendChild(h('div.card.culture', h('h2', '🇩🇪 Almanya\'da hayat'), h('p', lesson.culture)));
      stage.appendChild(continueBtn());
    }

    function showExercise(step) {
      var ex = DE.planner.exerciseById(step.id);
      if (!ex) return next();
      var exLesson = lesson || lessonOfExercise(step.id);
      var answered = false;
      var feedbackSlot = h('div');
      var el = X.render(ex, {
        lesson: exLesson,
        done: function (res) {
          if (answered) return;
          answered = true;
          DE.store.tick();
          var firstTime = !(step.id in run.first);
          if (!res.self && firstTime) run.first[step.id] = !!res.ok;
          if (!res.self) {
            DE.store.recordAttempt(ex, res.ok, { q: ex.q || ex.tr || ex.de || '', given: res.given, expected: res.expected, tags: res.tags });
            if (!res.ok && res.word) run.wrongWords[res.word] = true;
            if (!res.ok && !isTest && !run.retried[step.id]) {
              run.retried[step.id] = true;
              run.steps.splice(Math.min(run.pos + 1 + RETRY_GAP, run.steps.length - 1), 0, { k: 'ex', id: step.id, retry: true });
            }
          }
          DE.store.save();
          if (el.noAutoFeedback) { next(); return; }
          feedbackSlot.appendChild(X.feedback(res, ex));
          var buttons = [];
          if (!res.ok && !res.self && ['type', 'cloze', 'listen'].indexOf(ex.type) >= 0) {
            buttons.push(h('button.btn.ghost', { type: 'button', onclick: function () {
              run.first[step.id] = true; DE.store.save(); next();
            } }, 'Aslında doğruydu'));
          }
          if (!res.ok && !res.self) {
            var aiSlot = h('div');
            buttons.push(h('button.btn.ghost', { type: 'button', onclick: function () {
              aiSlot.innerHTML = '';
              aiSlot.appendChild(DE.ai.panel(DE.ai.explainPrompt({ level: DE.ai.levelOf(exLesson), q: [ex.q, ex.tr, ex.de].filter(Boolean).join(' / '), given: res.given || '', expected: res.expected || '' }), 'Nedenini yapay zekâya sor'));
            } }, '🤖 Neden?'));
            feedbackSlot.appendChild(aiSlot);
          }
          feedbackSlot.appendChild(h('div.actions', buttons, continueBtn().firstChild));
        }
      });
      if (step.retry) stage.appendChild(h('div.tiny.muted', '↻ Bu soruyu tekrar deniyoruz'));
      stage.appendChild(h('div.card', el));
      stage.appendChild(feedbackSlot);
      keyHandler = function (e) { if (!answered && el.onKey && !isTyping(e)) el.onKey(e.key); };
    }

    function score() {
      var ids = Object.keys(run.first);
      if (!ids.length) return 1;
      return ids.filter(function (k) { return run.first[k]; }).length / ids.length;
    }

    function showEnd() {
      var sc = score();
      var pct = Math.round(sc * 100);
      var card = h('div.card.end');
      if (isTest) {
        DE.store.finishTest(unit.id, sc);
        var passed = sc >= DE.planner.PASS;
        card.appendChild(h('h2', passed ? '🎉 Ünite testini geçtin!' : 'Test bitti'));
        card.appendChild(h('div.score' + (passed ? '.good' : '.meh'), pct + '%'));
        card.appendChild(h('p', passed ? 'Bu ünitedeki konuları oturttun. Sonraki üniteye geçebilirsin.'
          : 'Geçme sınırı %' + Math.round(DE.planner.PASS * 100) + '. Yanlış yaptığın konuların derslerine göz at, tekrarlarını yap ve yarın testi yeniden dene.'));
        if (!passed) card.appendChild(h('p.small.muted', 'İpucu: "Hata Defteri"nde bu testte yaptığın hataları görebilirsin.'));
        // Testi açık bırakmamak için hedef: tekrar dene veya kursa dön.
        stage.appendChild(card);
        stage.appendChild(h('div.actions',
          h('a.btn', { href: '#/mistakes' }, 'Hata Defteri'),
          h('a.btn.primary', { href: '#/today' }, 'Bugün ekranına dön')));
      } else {
        var created = DE.store.finishLesson(lesson, sc, run.wrongWords);
        card.appendChild(h('h2', '✓ Ders tamamlandı'));
        card.appendChild(h('div.score' + (sc >= 0.8 ? '.good' : '.meh'), pct + '%'));
        card.appendChild(h('p', sc >= 0.8 ? 'Harika! ' : 'Bitirdin, bu önemli. '));
        if (created) card.appendChild(h('p', '🗂 ' + created + ' yeni kart tekrar destene eklendi. Yarın ilk tekrarları gelecek.'));
        if (sc < 0.6) card.appendChild(h('p.small', 'Bu ders zor geçti. İstersen yarın tekrardan sonra bu dersi bir kez daha yap (Kurs ekranından).'));
        stage.appendChild(card);
        var nl = DE.planner.nextLesson();
        stage.appendChild(h('div.actions',
          h('a.btn', { href: '#/today' }, 'Bugün ekranı'),
          nl ? h('a.btn.primary', { href: '#/lesson/' + nl.id }, 'Sonraki ders →') : null));
      }
      setProgress();
    }

    show();
  }

  function runTitle(run) {
    if (run.type === 'test') { var u = DE.content.unitById[run.id]; return 'Test: ' + (u ? u.title : run.id); }
    var l = DE.content.lessonById[run.id];
    return l ? l.title : run.id;
  }

  function isTyping(e) { var t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'); }

  function dialogEl(d) {
    var showTr = false;
    var box = h('div.dialog');
    if (d.title) box.appendChild(h('div.dialog-title', '💬 ' + d.title));
    var lines = d.lines.map(function (l) {
      return h('div.line', { onclick: function () { DE.audio.speak(l.de); } },
        h('span.speaker', l.s + ':'), ' ', h('span.de', { lang: 'de' }, l.de), h('div.tr', l.tr));
    });
    lines.forEach(function (l) { box.appendChild(l); });
    var playing = false;
    box.appendChild(h('div.row.wrap',
      h('button.btn', { type: 'button', onclick: function () {
        if (playing) return; playing = true;
        var i = 0;
        (function step() {
          lines.forEach(function (x) { x.classList.remove('now'); });
          if (i >= d.lines.length) { playing = false; return; }
          lines[i].classList.add('now');
          DE.audio.speak(d.lines[i].de).then(function () { i++; setTimeout(step, 350); });
        })();
      } }, '▶ Diyaloğu dinle'),
      h('button.btn.ghost', { type: 'button', onclick: function (e) {
        showTr = !showTr; box.classList.toggle('show-tr', showTr); e.currentTarget.textContent = showTr ? 'Çeviriyi gizle' : 'Çeviriyi göster';
      } }, 'Çeviriyi göster')));
    box.appendChild(h('div.tiny.muted', 'Bir satıra dokununca o satır okunur. Önce çeviriye bakmadan anlamaya çalış.'));
    return box;
  }

  DE.views = DE.views || {};
  DE.views.lesson = function (root, id) { return view(root, id, 'lesson'); };
  DE.views.test = function (root, id) { return view(root, id, 'test'); };
  DE.views.lesson.onKey = function (e) { if (view.onKey) view.onKey(e); };
  DE.views.test.onKey = DE.views.lesson.onKey;
  DE.views.dialogEl = dialogEl;
  DE.views.runTitle = runTitle;
})(window.DE = window.DE || {});

</script>
<script>/* js/views/review.js */
// Tekrar (FSRS) oturumu. Kart yönleri: de-tr (tanı, kendin değerlendir), art (artikel seç), tr-de (yaz).
(function (DE) {
  'use strict';

  var h = DE.util.h;
  var X = DE.exercises;
  var LABELS = ['Tekrar', 'Zor', 'İyi', 'Kolay'];

  function view(root, arg) {
    var plan = DE.planner.today();
    var limit = arg === 'all' ? null : plan.reviewBudget;
    var queue = DE.store.dueQueue(limit);
    var total = queue.length, done = 0, again = 0, requeued = {};
    var stage = h('div.stage');
    var bar = h('div.bar');
    root.appendChild(h('div.player',
      h('div.player-head', h('a.back', { href: '#/today' }, '✕'), h('div.progress', bar), h('div.small.muted.ptitle', 'Tekrar')),
      stage));

    var keyHandler = null;
    DE.views.review.onKey = function (e) { if (keyHandler) keyHandler(e); };

    if (!queue.length) {
      stage.appendChild(h('div.card.end', h('h2', '✓ Bugün tekrar edilecek kart yok'), h('p', 'Yeni kartlar dersleri bitirdikçe gelir.')));
      stage.appendChild(h('div.actions', h('a.btn.primary', { href: '#/today' }, 'Bugün ekranı')));

    function grade(card, g) {
      DE.store.tick();

      done++;
      if (g === 1) {
        again++;
        if ((requeued[card.id] || 0) < 2) {
          requeued[card.id] = (requeued[card.id] || 0) + 1;
          queue.splice(Math.min(queue.length, 3 + Math.floor(Math.random() * 3)), 0, DE.store.state.cards[card.id]);
          total++;

      next();
    }

    function next() {
      DE.audio.stop();
      keyHandler = null;
      stage.innerHTML = '';

      var card = queue.shift();
      if (!card) return finish();
      var w = DE.content.words[card.w];
      if (!w) return next();
      if (card.dir === 'art') return showArticle(card, w);
      if (card.dir === 'tr-de') return showProduce(card, w);

    function gradeButtons(card) {

        return h('button.btn.grade.g' + (i + 1), { type: 'button', onclick: function () { grade(card, i + 1); } },
          h('span.kbd', String(i + 1)), ' ', l, h('span.tiny', DE.util.fmtInterval(prev[i])));
      }));
      keyHandler = function (e) { var n = parseInt(e.key, 10); if (n >= 1 && n <= 4) grade(card, n); };
      return row;
    }

    function showRecognize(card, w) {
      var full = (w.art ? w.art + ' ' : '') + w.de;
      var back = h('div.back', { hidden: true },
        h('div.meaning', w.tr, DE.store.state.settings.showEn && w.en ? h('span.en', ' · 🇬🇧 ' + w.en) : null),
        w.pos === 'n' && w.pl && w.pl !== '-' ? h('div.muted', 'Çoğul: die ' + w.pl) : null,
        w.ex ? h('div.example', h('div', { lang: 'de' }, w.ex.de, ' ', DE.audio.button(w.ex.de)), h('div.muted', w.ex.tr)) : null);
      var reveal = h('button.btn.primary.wide', { type: 'button', onclick: show }, 'Cevabı göster (boşluk)');
      var actions = h('div.actions', reveal);
      function show() {
        back.hidden = false;
        actions.innerHTML = '';
        actions.appendChild(gradeButtons(card));
      }
      stage.appendChild(h('div.card.flash',
        h('div.tiny.muted', 'Anlamı ne?'),
        h('div.big-word', { lang: 'de' }, X.wordEl(w), ' ', DE.audio.button(full)),
        back));
      stage.appendChild(actions);
      keyHandler = function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); show(); } };
      DE.audio.speak(full);
    }

    function afterAuto(card, res, ex) {

      var buttons = [];
      if (!res.ok && card.dir === 'tr-de') buttons.push(h('button.btn.ghost', { type: 'button', onclick: function () { grade(card, 3); } }, 'Aslında doğruydu'));
      var go = h('button.btn.primary', { type: 'button', onclick: function () { grade(card, g); } }, 'Devam ↵');
      buttons.push(go);
      stage.appendChild(fb);
      stage.appendChild(h('div.actions', buttons));
      setTimeout(function () { go.focus(); }, 20);
      keyHandler = function (e) { if (e.key === 'Enter' && e.target.tagName !== 'INPUT') { e.preventDefault(); grade(card, g); } };
    }

    function showArticle(card, w) {
      var ex = { id: card.id, type: 'article', word: w.id };
      var el = X.render(ex, { done: function (res) { keyHandler = null; afterAuto(card, res, ex); } });
      stage.appendChild(h('div.card', el));
      keyHandler = function (e) { if (el.onKey) el.onKey(e.key); };
    }

    function showProduce(card, w) {
      var target = (w.art ? w.art + ' ' : '') + w.de;
      var ex = { id: card.id, type: 'type' };
      var el = h('div.ex',
        h('div.q', 'Almancası?' + (w.art ? ' (artikeliyle)' : '')),
        h('div.tr-line.big', w.tr, DE.store.state.settings.showEn && w.en ? h('span.en', ' · 🇬🇧 ' + w.en) : null));
      var inp = X.textInput(function (v) {

    }

    function finish() {

      stage.appendChild(h('div.card.end',
        h('h2', '✓ Tekrar bitti'),
        h('p', done + ' kart tekrar edildi' + (again ? ', ' + again + ' kez "Tekrar" dedin — normal, unutmak öğrenmenin parçası.' : '.')),
        plan2.due > 0 ? h('p.small.muted', 'Bekleyen ' + plan2.due + ' kart daha var. İstersen hepsini bitirebilirsin.') : null));
      stage.appendChild(h('div.actions',
        plan2.due > 0 ? h('a.btn', { href: '#/review/all', onclick: function () { setTimeout(function () { DE.app.route(); }, 0); } }, 'Kalan tekrarlar') : null,
        lessonStep ? h('a.btn.primary', { href: lessonStep.kind === 'lesson' ? '#/lesson/' + lessonStep.lesson.id : '#/test/' + lessonStep.unit.id },
          lessonStep.kind === 'lesson' ? 'Yeni derse geç →' : 'Ünite testine geç →') : h('a.btn.primary', { href: '#/today' }, 'Bugün ekranı')));
    }

    next();
  }

  DE.views = DE.views || {};
  DE.views.review = view;

(function (DE) {
  'use strict';

  var h = DE.util.h;

  function learnedWordIds() {
    var S = DE.store.state;
    var ids = {};
    Object.keys(S.cards).forEach(function (k) { ids[S.cards[k].w] = true; });
    return ids;
  }

  function strength(wid) {
    var c = DE.store.state.cards[wid + '#de-tr'];
    if (!c) return null;
    return Math.round(c.s);
  }

  function words(root) {
    var S = DE.store.state;
    var learned = learnedWordIds();
    var filter = { q: '', mode: Object.keys(learned).length ? 'learned' : 'all' };
    root.appendChild(h('h1', 'Kelimeler'));
    var search = h('input.search', { type: 'search', placeholder: 'Ara (Almanca, Türkçe veya İngilizce)…', oninput: function () { filter.q = search.value.toLowerCase(); draw(); } });
    var modes = h('div.row.wrap', [['learned', 'Öğrendiklerim'], ['all', 'Tümü'], ['ff', '⚠️ Sahte arkadaşlar'], ['weak', 'Zayıflar']].map(function (m) {
      return h('button.chip', { type: 'button', 'data-m': m[0], onclick: function () { filter.mode = m[0]; draw(); } }, m[1]);
    }));
    var list = h('div.wordlist');
    root.appendChild(search); root.appendChild(modes); root.appendChild(list);

      modes.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c.getAttribute('data-m') === filter.mode); });
      list.innerHTML = '';
      var all = DE.content.allLessons().reduce(function (acc, l) { return acc.concat(l.words || []); }, []);
      var seen = {};
      var rows = all.filter(function (w) {
        if (seen[w.id]) return false; seen[w.id] = true;
        if (filter.mode === 'learned' && !learned[w.id]) return false;

        if (filter.q) {

        var st = strength(w.id);
        list.appendChild(h('div.wrow', { onclick: function () { DE.audio.speak((w.art ? w.art + ' ' : '') + w.de); } },

          h('div.wtr', w.tr, S.settings.showEn && w.en ? h('span.en', ' · ' + w.en) : null, w.ff ? h('div.tiny.warn', '⚠️ ' + w.ff) : null),
          h('div.wst.tiny.muted', st == null ? '' : st >= 21 ? '●●●' : st >= 5 ? '●●○' : '●○○')));
      });
      list.appendChild(h('p.tiny.muted', rows.length + ' kelime · ●○○ yeni, ●●○ oturuyor, ●●● sağlam. Satıra dokununca okunur.'));

  }

  function grammar(root) {
    var S = DE.store.state;
    var next = DE.planner.nextLesson();

    var toggle = h('label.small', h('input', { type: 'checkbox', onchange: function (e) { showAll = e.target.checked; draw(); } }), ' Henüz gelmediğim konuları da göster');
    var legend = h('div.card.legend', h('b', 'Artikel renkleri: '), h('span.art.der', 'der'), ' maskulin · ', h('span.art.die', 'die'), ' feminin · ', h('span.art.das', 'das'), ' nötr · ', h('span.art.pl', 'die'), ' çoğul');
    var list = h('div');

  var TAG_NAMES = {
    article: 'Artikel (der/die/das)', 'article.missing': 'Artikeli unutmak', 'verb.conj': 'Fiil çekimi', word_order: 'Kelime sırası',

    negation: 'Olumsuzluk', possessive: 'İyelik (mein/dein)', formal: 'du / Sie', 'case.acc': 'Akkusativ'

  function mistakes(root) {
    var S = DE.store.state;
    root.appendChild(h('h1', 'Hata Defteri'));
    root.appendChild(h('p.small.muted', 'Hatalar öğrenmenin hammaddesi. Burada en sık zorlandığın konular ve son hataların var.'));
    var tags = Object.keys(S.tags).map(function (k) { return { k: k, n: S.tags[k].n, w: S.tags[k].wrong }; })
      .filter(function (t) { return t.w > 0 && t.n >= 3; })
      .sort(function (a, b) { return (b.w / b.n) - (a.w / a.n); }).slice(0, 6);
    if (tags.length) {
      root.appendChild(h('div.card', h('h3', 'Zayıf noktalar'), tags.map(function (t) {
        var pct = Math.round(100 * t.w / t.n);
        return h('div.tagrow', h('div', TAG_NAMES[t.k] || t.k), h('div.meter', h('div', { style: { width: pct + '%' } })), h('div.tiny.muted', pct + '% hata · ' + t.n + ' deneme'));

    var recent = S.mistakes.slice(-40).reverse();
    if (!recent.length) { root.appendChild(h('p.muted', 'Henüz kayıtlı hata yok.')); return; }
    root.appendChild(h('h3', 'Son hatalar'));
    recent.forEach(function (m) {
      var slot = h('div');
      root.appendChild(h('div.card.mistake',
        m.q ? h('div.small', m.q) : null,
        h('div', h('span.bad-text', m.given || '—'), ' → ', h('b', { lang: 'de' }, m.expected || '')),
        h('div.tiny.muted', new Date(m.ts).toLocaleDateString('tr-TR') + (m.tags.length ? ' · ' + m.tags.map(function (t) { return TAG_NAMES[t] || t; }).join(', ') : '')),
        m.expected ? h('button.btn.ghost.small', { type: 'button', onclick: function () {
          slot.innerHTML = '';
          slot.appendChild(DE.ai.panel(DE.ai.explainPrompt({ level: 'A1', q: m.q, given: m.given, expected: m.expected }), 'Nedenini sor'));
        } }, '🤖 Neden?') : null,
        slot));
    });
  }

  DE.views = DE.views || {};
  DE.views.words = words;
  DE.views.grammar = grammar;
  DE.views.mistakes = mistakes;
})(window.DE = window.DE || {});

</script>
<script>/* js/views/settings.js */
// Ayarlar: ses, görünüm, hedefler, yapay zekâ servisleri, yedekleme.
(function (DE) {
  'use strict';

  var h = DE.util.h;

  function settings(root) {
    var S = DE.store.state;
    var st = S.settings;
    function set(k, v) { st[k] = v; DE.store.save(); }

    root.appendChild(h('h1', 'Ayarlar'));

    // Yedekleme
    var importInput = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: function () {
      var f = importInput.files[0];
      if (!f) return;
      f.text().then(function (txt) {
        if (!confirm('Mevcut ilerlemenin yerine bu yedek yüklenecek. Emin misin?')) return;
        try { DE.store.importJson(txt); alert('Yedek yüklendi.'); location.hash = '#/today'; DE.app.route(); }
        catch (e) { alert('Yüklenemedi: ' + e.message); }
      });
    } });
    root.appendChild(h('div.card',
      h('h3', '💾 Yedek'),
      h('p.small', 'İlerlemen bu tarayıcının deposunda duruyor. Tarayıcı geçmişini/verilerini temizlersen ya da başka tarayıcı kullanırsan görünmez. Haftada bir yedek indir ve bu klasörde sakla.'),
      h('p.tiny.muted', st.lastExport ? 'Son yedek: ' + new Date(st.lastExport).toLocaleString('tr-TR') : 'Henüz yedek alınmadı.'),
      h('div.row.wrap',
        h('button.btn.primary', { type: 'button', onclick: function () {
          var blob = new Blob([DE.store.exportJson()], { type: 'application/json' });
          var a = h('a', { href: URL.createObjectURL(blob), download: 'almanca-ilerleme-' + DE.util.dayKey() + '.json' });
          document.body.appendChild(a); a.click(); a.remove();
          DE.app.route();
        } }, 'Yedeği indir'),
        h('button.btn', { type: 'button', onclick: function () { importInput.click(); } }, 'Yedekten yükle'),
        importInput)));

    // Ses
    var voices = DE.audio.germanVoices();
    var cur = DE.audio.pickVoice();
    root.appendChild(h('div.card',
      h('h3', '🔊 Ses'),
      voices.length ? h('label.field', 'Almanca ses',
        h('select', { onchange: function (e) { set('voice', e.target.value); DE.audio.speak('Hallo! Ich heiße Anna. Wie heißt du?'); } },
          h('option', { value: '' }, 'Otomatik (en iyisi)'),
          voices.map(function (v) { return h('option', { value: v.name, selected: st.voice === v.name }, v.name + (v.localService ? '' : ' (çevrimiçi)')); })))
        : h('p.small.warn', 'Bu tarayıcıda Almanca ses bulunamadı. Chrome veya Edge önerilir; Windows\'ta Ayarlar › Saat ve dil › Konuşma bölümünden Almanca ses paketi eklenebilir.'),
      cur ? h('p.tiny.muted', 'Şu an kullanılan: ' + cur.name) : null,
      h('label.field', 'Konuşma hızı: ', h('b', String(st.rate)),
        h('input', { type: 'range', min: 0.6, max: 1.2, step: 0.05, value: st.rate, oninput: function (e) { set('rate', parseFloat(e.target.value)); e.target.previousSibling.textContent = e.target.value; } })),
      h('button.btn.ghost', { type: 'button', onclick: function () { DE.audio.speak('Guten Tag! Ich komme aus der Türkei und wohne jetzt in Deutschland.'); } }, '▶ Dene'),
      h('label.check', h('input', { type: 'checkbox', checked: st.stt, onchange: function (e) { set('stt', e.target.checked); } }),
        ' Konuşma tanımayı aç ', DE.audio.sttAvailable() ? '' : h('span.warn', '(bu tarayıcıda yok)')),
      h('p.tiny.muted', 'Konuşma tanıma Chrome/Edge\'de çalışır ve sesin tanıma için Google/Microsoft sunucusuna gider. Kapalıyken de kayıt-dinle-karşılaştır her zaman çalışır.')));

    // Öğrenme
    root.appendChild(h('div.card',
      h('h3', '🎯 Öğrenme'),
      h('label.field', 'Varsayılan günlük süre',
        h('select', { onchange: function (e) { set('minutes', parseInt(e.target.value, 10)); } },
          [15, 30, 45, 60].map(function (m) { return h('option', { value: m, selected: st.minutes === m }, m + ' dk'); }))),
      h('label.field', 'Haftalık gün hedefi',
        h('select', { onchange: function (e) { set('weeklyGoal', parseInt(e.target.value, 10)); } },
          [3, 4, 5, 6, 7].map(function (m) { return h('option', { value: m, selected: st.weeklyGoal === m }, m + ' gün'); }))),
      h('label.check', h('input', { type: 'checkbox', checked: st.showEn, onchange: function (e) { set('showEn', e.target.checked); } }), ' İngilizce karşılıkları ve sahte arkadaş uyarılarını göster')));

    // Yapay zekâ servisleri
    var aiList = h('div');
    function drawAi() {
      aiList.innerHTML = '';
      st.ai.forEach(function (s, i) {
        aiList.appendChild(h('div.row.ai-row',
          h('input', { value: s.name, placeholder: 'Ad', onchange: function (e) { st.ai[i].name = e.target.value; DE.store.save(); } }),
          h('input.grow', { value: s.url, placeholder: 'https://…{q}', onchange: function (e) { st.ai[i].url = e.target.value; DE.store.save(); } }),
          h('button.btn-icon', { type: 'button', title: 'Sil', onclick: function () { st.ai.splice(i, 1); DE.store.save(); drawAi(); } }, '🗑')));
      });
    }
    drawAi();
    root.appendChild(h('div.card',
      h('h3', '🤖 Yapay zekâ servisleri'),
      h('p.small', '"Yapay zekâya sor" butonları bu listeyi kullanır. Hesap veya API anahtarı gerekmez: istem panoya kopyalanır ve site açılır. Adreste {q} varsa kısa istemler otomatik doldurulur.'),
      aiList,
      h('button.btn.ghost', { type: 'button', onclick: function () { st.ai.push({ name: 'Yeni', url: 'https://' }); DE.store.save(); drawAi(); } }, '+ Servis ekle')));

    // Sıfırla
    root.appendChild(h('div.card',
      h('h3', '⚠️ Sıfırla'),
      h('p.small', 'Tüm ilerlemeyi siler. Önce yedek indir.'),
      h('button.btn.danger', { type: 'button', onclick: function () {
        var t = prompt('Tüm ilerleme silinecek. Onaylamak için SIL yaz:');
        if (t && t.trim().toUpperCase() === 'SIL') { DE.store.reset(); location.hash = '#/today'; DE.app.route(); }
      } }, 'Her şeyi sil')));

    var errs = DE.content.errors;
    if (errs.length) root.appendChild(h('div.card.warn', h('h3', 'İçerik hataları (' + errs.length + ')'), h('pre.small', errs.join('\n'))));
    root.appendChild(h('p.tiny.muted', 'Almanca Öğrenme · yerel sürüm · içerik: ' + DE.content.units.length + ' ünite, ' + Object.keys(DE.content.words).length + ' kelime'));
  }

  DE.views = DE.views || {};
  DE.views.settings = settings;
})(window.DE = window.DE || {});

</script>
<script>/* js/app.js */
// Uygulama başlangıcı ve hash yönlendirici: #/today, #/path, #/lesson/<id>, #/test/<unit>, #/review, #/words, #/grammar, #/mistakes, #/settings
(function (DE) {
  'use strict';

  var h = DE.util.h;
  var NAV = [
    ['today', '🏠', 'Bugün'], ['path', '🗺', 'Kurs'], ['review', '🗂', 'Tekrar'],
    ['words', '📒', 'Kelimeler'], ['grammar', '📘', 'Gramer'], ['mistakes', '🩹', 'Hatalar'], ['settings', '⚙️', 'Ayarlar']
  ];
  var FULLSCREEN = { lesson: 1, test: 1, review: 1 };
  var current = null;

  function parse() {
    var m = (location.hash || '').replace(/^#\/?/, '').split('/');
    return { name: m[0] || 'today', arg: m.slice(1).join('/') || null };
  }

  function route() {
    var r = parse();
    var view = DE.views[r.name];
    if (!view) { location.hash = '#/today'; return; }
    DE.audio.stop();
    DE.store.pauseTick();
    current = r.name;
    var main = document.getElementById('main');
    main.innerHTML = '';
    document.body.classList.toggle('focus', !!FULLSCREEN[r.name]);
    document.querySelectorAll('nav.tabs a').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-v') === r.name); });
    if (r.name === 'review') {
      var due = DE.store.dueCount();
      var badge = document.querySelector('nav.tabs a[data-v=review] .badge');
      if (badge) badge.textContent = due ? String(due) : '';
    }
    view(main, r.arg);
    updateBadge();
  }

  function updateBadge() {
    var badge = document.querySelector('nav.tabs a[data-v=review] .badge');
    if (!badge) return;
    var due = DE.store.dueCount();
    badge.textContent = due ? String(due) : '';
  }

  function nav() {
    return h('nav.tabs', NAV.map(function (n) {
      return h('a', { href: '#/' + n[0], 'data-v': n[0] }, h('span.ni', n[1]), h('span.nl', n[2]), n[0] === 'review' ? h('span.badge') : null);
    }));
  }

  function boot() {
    DE.store.load();
    document.body.appendChild(nav());
    document.body.appendChild(h('main', { id: 'main' }));
    window.addEventListener('hashchange', route);
    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var v = DE.views[current];
      if (v && v.onKey) v.onKey(e);
    });
    if (DE.content.errors.length) console.warn('İçerik hataları var; Ayarlar ekranının altında listelenir.');
    route();
  }

  DE.app = { route: route, boot: boot };
  document.addEventListener('DOMContentLoaded', boot);
})(window.DE = window.DE || {});

</script>
</body>
