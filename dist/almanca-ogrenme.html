<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almanca Öğren · A1–A2</title>
<style>/* css/app.css */
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1f24; --muted: #6b6f78; --line: #e3e1da;
  --accent: #2f6fde; --accent-ink: #fff; --ok: #1f9d55; --ok-bg: #e7f6ec; --bad: #d64545; --bad-bg: #fdecec;
  --warn: #b7791f; --warn-bg: #fff6e0;
  --der: #2563eb; --die: #dc2626; --das: #16a34a; --pl: #9333ea;
  --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171c; --card: #1f2229; --ink: #e8e9ec; --muted: #9aa0ab; --line: #2e323b;
    --accent: #5b8ff0; --ok-bg: #173325; --bad-bg: #3a1d1d; --warn-bg: #3a3018;
    --der: #6b9bff; --die: #ff6b6b; --das: #4ade80; --pl: #c084fc;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 96px; }
h1 { font-size: 1.6rem; margin: .4em 0 .6em; }
h2 { font-size: 1.25rem; margin: .2em 0 .5em; }
h3 { font-size: 1.05rem; margin: 1em 0 .5em; }
a { color: var(--accent); }
p { margin: .5em 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; } .tiny { font-size: .78rem; }
.warn { color: var(--warn); }
.row { display: flex; gap: 8px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
[hidden] { display: none !important; }

/* Navigasyon */
nav.tabs { position: sticky; top: 0; z-index: 5; display: flex; justify-content: center; gap: 2px; background: var(--card); border-bottom: 1px solid var(--line); padding: 4px; overflow-x: auto; }
nav.tabs a { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 10px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: .78rem; min-width: 64px; }
nav.tabs a .ni { font-size: 1.2rem; line-height: 1.2; }
nav.tabs a.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
nav.tabs .badge:not(:empty) { position: absolute; top: 2px; right: 8px; background: var(--bad); color: #fff; border-radius: 10px; font-size: .68rem; padding: 0 5px; }
body.focus nav.tabs { display: none; }

/* Kartlar ve butonlar */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.big { font-size: 1.15rem; padding: 14px 22px; }
.btn.wide { width: 100%; }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-icon { border: 0; background: transparent; cursor: pointer; font-size: 1.05rem; padding: 2px 4px; border-radius: 6px; }
.btn-icon:hover { background: var(--line); }
.btn-icon.slow { font-size: .9rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin: 14px 0; }
.actions .wide { flex: 1; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; min-height: 40px; }
.chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.kbd { display: inline-block; min-width: 1.4em; padding: 0 4px; border: 1px solid var(--line); border-radius: 5px; font-size: .75rem; color: var(--muted); text-align: center; }
.cta { margin: 12px 0; }
.banner { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: .92rem; }
.note { background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: .92rem; }
.note.warn { color: inherit; border-left: 4px solid var(--warn); }

/* Artikel renkleri (renk + yazı; renk körlüğünde de artikel metni görünür) */
.art { font-weight: 700; }
.art.der, .der { color: var(--der); } .art.die, .die { color: var(--die); } .art.das, .das { color: var(--das); } .art.pl, .pl { color: var(--pl); }
.art-btn.der { border-color: var(--der); color: var(--der); } .art-btn.die { border-color: var(--die); color: var(--die); } .art-btn.das { border-color: var(--das); color: var(--das); }

/* Bugün */
.week { margin: 10px 0; }
.week-days { display: flex; gap: 6px; }
.wd { flex: 1; text-align: center; }
.wd .dot { height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.wd.on .dot { background: var(--ok); border-color: var(--ok); }
.wd.today .dot { outline: 2px solid var(--accent); outline-offset: 1px; }
.minutes { margin: 12px 0; }
.plan-item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 10px 0; text-decoration: none; color: inherit; box-shadow: var(--shadow); }
.plan-item:hover { border-color: var(--accent); }
.pi-icon { font-size: 1.6rem; } .pi-body { flex: 1; } .pi-title { font-weight: 600; } .pi-cta { color: var(--accent); font-weight: 600; white-space: nowrap; }
.ext ul { padding-left: 1.2em; }
.ext summary, details summary { cursor: pointer; }

/* Kurs */
.unit summary { list-style: none; }
.unit summary::-webkit-details-marker { display: none; }
.unit-title { font-weight: 600; font-size: 1.05rem; }
.unit-no { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; align-items: center; justify-content: center; font-size: .9rem; }
.unit.passed .unit-no { background: var(--ok); }
.goals { color: var(--muted); font-size: .9rem; padding-left: 1.2em; }
.lessons { list-style: none; padding: 0; margin: 8px 0 0; }
.lesson a { display: block; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); }
.lesson a:hover { background: var(--bg); }
.lesson.done .st { color: var(--ok); } .lesson.locked a { color: var(--muted); }
.lesson.next a { background: color-mix(in srgb, var(--accent) 10%, transparent); font-weight: 600; }
.st { display: inline-block; width: 1.4em; }

/* Oynatıcı */
body.focus main { padding-top: 8px; }
.player-head { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 4; flex-wrap: wrap; }
.player-head .back { text-decoration: none; font-size: 1.3rem; color: var(--muted); padding: 4px 8px; }
.progress { flex: 1; height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; min-width: 120px; }
.progress .bar { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
.ptitle { width: 100%; }
.intro { font-size: 1.05rem; }
.dialog .line { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.dialog .line:hover { background: var(--bg); }
.dialog .line.now { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.dialog .speaker { font-weight: 600; color: var(--muted); }
.dialog .de { font-size: 1.05rem; }
.dialog .tr { display: none; color: var(--muted); font-size: .9rem; }
.dialog.show-tr .tr { display: block; }
.dialog-title { font-weight: 600; margin-bottom: 6px; }
.big-word { font-size: 2rem; font-weight: 600; margin: 8px 0; }
.meaning { font-size: 1.3rem; margin: 6px 0; }
span.en { color: var(--muted); font-size: .9em; }
.example { border-left: 3px solid var(--line); padding-left: 10px; margin: 10px 0; }
.grammar h2 { margin-top: 0; }
.ghtml table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: .95rem; }
.ghtml th, .ghtml td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.ghtml th { background: var(--bg); }
.ghtml .bridge { background: color-mix(in srgb, var(--ok) 10%, transparent); border-radius: 8px; padding: 8px 10px; }
.ghtml .bridge.en { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.speakable { cursor: pointer; }
.speakable:hover { text-decoration: underline dotted; }
.culture { border-left: 5px solid #f2c94c; }

/* Alıştırmalar */
.q { font-weight: 600; margin-bottom: 8px; }
.de-line { font-size: 1.25rem; margin: 8px 0; }
.de-line.big { font-size: 1.5rem; }
.tr-line { color: var(--muted); margin: 6px 0; }
.tr-line.big { font-size: 1.4rem; color: var(--ink); }
.task { font-size: 1.05rem; margin: 6px 0; }
.options { display: grid; gap: 8px; margin-top: 10px; }
.options.row { display: flex; }
.options.row .option { flex: 1; font-size: 1.2rem; font-weight: 700; }
.option { text-align: left; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; min-height: 48px; }
.option:hover:not(:disabled) { border-color: var(--accent); }
.option.small { padding: 8px 10px; min-height: 42px; }
.option.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.option.right { border-color: var(--ok); background: var(--ok-bg); }
.option.wrong { border-color: var(--bad); background: var(--bad-bg); }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match-grid .col { display: grid; gap: 8px; align-content: start; }
.input-wrap input.answer, textarea.answer { width: 100%; font: inherit; font-size: 1.2rem; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
.input-wrap input.answer:focus, textarea.answer:focus { outline: none; border-color: var(--accent); }
textarea.answer { font-size: 1.05rem; resize: vertical; }
.umlauts { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.key { min-width: 40px; min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 1.05rem; cursor: pointer; }
.cloze .gap { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); }
.cloze .gap.right { color: var(--ok); border-color: var(--ok); } .cloze .gap.wrong { color: var(--bad); border-color: var(--bad); }
.hint { color: var(--muted); font-size: .9rem; }
.listen-big { display: flex; gap: 10px; justify-content: center; margin: 14px 0; }
.order-line { min-height: 56px; border-bottom: 2px solid var(--line); padding: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.order-bank { padding: 12px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip.used { opacity: .25; }
.blank-art { color: var(--muted); }

/* Geri bildirim */
.feedback { border-radius: 12px; padding: 12px 14px; margin: 12px 0; border: 1px solid var(--line); }
.feedback.ok { background: var(--ok-bg); border-color: var(--ok); }
.feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
.feedback.partial { background: var(--warn-bg); border-color: var(--warn); }
.feedback.neutral { background: var(--card); }
.fb-title { font-weight: 700; margin-bottom: 4px; }
.fb-note, .fb-explain, .fb-expected { margin-top: 6px; }
.diff { margin-top: 6px; font-size: 1.05rem; }
.diff span { padding: 1px 4px; border-radius: 4px; margin-right: 3px; }
.diff .add { background: var(--bad-bg); text-decoration: line-through; color: var(--bad); }
.diff .del { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.ai-panel { border: 1px dashed var(--accent); border-radius: 12px; padding: 12px; margin: 12px 0; }
.ai-title { font-weight: 600; }
pre.prompt { white-space: pre-wrap; font-size: .82rem; background: var(--bg); padding: 8px; border-radius: 8px; }
.checklist label { display: block; margin: 4px 0; }
.model { margin: 10px 0; }

/* Tekrar */
.flash { text-align: center; }
.flash .back { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.grade { flex-direction: column; gap: 0; font-weight: 600; }
.grade .tiny { font-weight: 400; color: var(--muted); }
.g1 { border-color: var(--bad); } .g2 { border-color: var(--warn); } .g3 { border-color: var(--ok); } .g4 { border-color: var(--accent); }
.end { text-align: center; }
.score { font-size: 3rem; font-weight: 800; }
.score.good { color: var(--ok); } .score.meh { color: var(--warn); }

/* Kütüphane */
.search { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); margin-bottom: 8px; }
.wordlist { margin-top: 10px; }
.wrow { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.wrow:hover { background: var(--card); }
.wde { font-size: 1.05rem; }
.legend { font-size: .92rem; }
.tagrow { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; align-items: center; margin: 8px 0; }
.tagrow .tiny { grid-column: 2; }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter div { height: 100%; background: var(--bad); }
.bad-text { color: var(--bad); text-decoration: line-through; }
.field { display: block; margin: 10px 0; }
.field select, .field input[type=range] { display: block; width: 100%; margin-top: 4px; font: inherit; padding: 6px; }
.check { display: block; margin: 8px 0; }
.ai-row { margin: 6px 0; }
.ai-row input { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-width: 0; }
.ai-row input:first-child { width: 110px; }

@media (max-width: 520px) {
  nav.tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; border-top: 1px solid var(--line); border-bottom: 0; justify-content: space-between; }
  nav.tabs a { min-width: 0; padding: 4px 6px; font-size: .68rem; }
  main { padding-bottom: 90px; }
  .big-word { font-size: 1.6rem; }
  .grades { grid-template-columns: repeat(2, 1fr); }
  .wrow { grid-template-columns: 1fr 1fr; }
  .wst { display: none; }
}

</style>

<script>/* js/core/util.js */
// Ortak yardımcılar: DOM oluşturma, tarih, rastgelelik.
(function (DE) {
  'use strict';

  var DAY = 24 * 60 * 60 * 1000;

  /**
   * Küçük DOM yardımcısı: h('div.card', {onclick: f}, 'metin', h('b', null, 'x'))
   * Nitelikler: class, html (innerHTML), on* (olay), style, diğerleri setAttribute.
   */
  function h(tag, attrs) {
    var parts = tag.split('.');
    var el = document.createElement(parts[0] || 'div');
    if (parts.length > 1) el.className = parts.slice(1).join(' ');
    var start = 2;
    // İkinci argüman nitelik nesnesi değilse (metin, dizi, eleman) çocuk sayılır.
    if (attrs != null && (typeof attrs !== 'object' || Array.isArray(attrs) || attrs.nodeType)) { start = 1; attrs = null; }
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className += (el.className ? ' ' : '') + v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (k in el && k !== 'list' && k !== 'type') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = start; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }

  function append(el, child) {
    if (child == null || child === false) return;
    if (Array.isArray(child)) return child.forEach(function (c) { append(el, c); });
    el.appendChild(typeof child === 'object' ? child : document.createTextNode(String(child)));
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** Yerel saatle YYYY-MM-DD. */
  function dayKey(ts) {
    var d = new Date(ts == null ? Date.now() : ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function startOfDay(ts) {
    var d = new Date(ts == null ? Date.now() : ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  /** Pazartesi başlangıçlı haftanın günleri (YYYY-MM-DD). */
  function weekDays(ts) {
    var d = new Date(startOfDay(ts));
    var shift = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - shift);
    var out = [];
    for (var i = 0; i < 7; i++) { out.push(dayKey(d.getTime())); d.setDate(d.getDate() + 1); }
    return out;
  }

  function shuffle(arr, rnd) {
    var a = arr.slice();
    rnd = rnd || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sample(arr, n, rnd) { return shuffle(arr, rnd).slice(0, n); }

  /** "3 gün", "2 sa", "10 dk" */
  function fmtInterval(ms) {
    var m = ms / 60000;
    if (m < 60) return Math.max(1, Math.round(m)) + ' dk';
    if (m < 60 * 24) return Math.round(m / 60) + ' sa';
    var d = m / 60 / 24;
    if (d < 31) return Math.round(d) + ' gün';
    if (d < 365) return Math.round(d / 30) + ' ay';
    return (d / 365).toFixed(1) + ' yıl';
  }

  DE.util = { DAY: DAY, h: h, esc: esc, dayKey: dayKey, startOfDay: startOfDay, weekDays: weekDays, shuffle: shuffle, sample: sample, fmtInterval: fmtInterval };
})(typeof window !== 'undefined' ? (window.DE = window.DE || {}) : (globalThis.DE = globalThis.DE || {}));

</script>
<script>/* js/core/content.js */
// İçerik kaydı ve doğrulaması. Tarayıcıda ve Node'da (tools/, tests/) aynı kod çalışır.
// İçerik dosyaları file:// altında fetch edilemediği için her ünite bir .js dosyasıdır
// ve DE.content.registerUnit({...}) çağırır. Şema: docs/icerik-semasi.md
(function (DE) {
  'use strict';

  var POS = ['n', 'v', 'adj', 'adv', 'phr', 'pron', 'num', 'prep', 'conj', 'art', 'q', 'other'];
  var ARTICLES = ['der', 'die', 'das'];
  var EX_TYPES = ['mcq', 'type', 'cloze', 'order', 'listen', 'article', 'match', 'speak', 'write'];
  var TR_ONLY = /[ışğİŞĞ]/;

  var content = {
    units: [],
    unitById: {},
    lessonById: {},
    words: {},
    errors: [],

    registerUnit: function (unit) {
      var errs = content.validateUnit(unit);
      if (errs.length) {
        content.errors = content.errors.concat(errs);
        if (typeof console !== 'undefined') console.error('İçerik hatası (' + (unit && unit.id) + '):\n' + errs.join('\n'));
      }
      if (!unit || !unit.id || content.unitById[unit.id]) return;
      content.units.push(unit);
      content.units.sort(function (a, b) { return a.order - b.order; });
      content.unitById[unit.id] = unit;
      (unit.lessons || []).forEach(function (lesson, li) {
        lesson.unitId = unit.id;
        lesson.index = li;
        content.lessonById[lesson.id] = lesson;
        (lesson.exercises || []).forEach(function (ex, i) { ex.id = ex.id || lesson.id + '.e' + (i + 1); });
        (lesson.words || []).forEach(function (w) {
          if (!content.words[w.id]) {
            w.unitId = unit.id;
            w.lessonId = lesson.id;
            content.words[w.id] = w;
          }
        });
      });
    },

    /** Tüm dersler, müfredat sırasıyla. */
    allLessons: function () {
      var out = [];
      content.units.forEach(function (u) { out = out.concat(u.lessons || []); });
      return out;
    },

    validateUnit: function (u) {
      var errs = [];
      function err(where, msg) { errs.push((u && u.id || '?') + (where ? ' › ' + where : '') + ': ' + msg); }
      function str(v) { return typeof v === 'string' && v.trim().length > 0; }
      function de(where, v) {
        if (!str(v)) return err(where, 'Almanca metin boş');
        if (TR_ONLY.test(v)) err(where, 'Almanca metinde Türkçe harf var: "' + v + '"');
      }

      if (!u || typeof u !== 'object') { errs.push('Ünite nesne değil'); return errs; }
      if (!/^u\d\d$/.test(u.id || '')) err('', 'id "uNN" biçiminde olmalı');
      if (typeof u.order !== 'number') err('', 'order sayı olmalı');
      ['level', 'title', 'titleTr'].forEach(function (k) { if (!str(u[k])) err('', k + ' eksik'); });
      if (!Array.isArray(u.goals) || !u.goals.length) err('', 'goals (can-do listesi) eksik');
      if (!Array.isArray(u.lessons) || !u.lessons.length) { err('', 'lessons boş'); return errs; }

      var seenWords = {};
      u.lessons.forEach(function (l, li) {
        var lw = 'ders ' + (li + 1) + (l && l.id ? ' (' + l.id + ')' : '');
        if (!new RegExp('^' + u.id + '\\.l\\d+$').test(l.id || '')) err(lw, 'id "' + u.id + '.lN" biçiminde olmalı');
        if (!str(l.title)) err(lw, 'title eksik');

        if (l.dialog) {
          if (!Array.isArray(l.dialog.lines) || !l.dialog.lines.length) err(lw, 'dialog.lines boş');
          else l.dialog.lines.forEach(function (line, i) {
            if (!str(line.s)) err(lw + ' dialog ' + (i + 1), 's (konuşan) eksik');
            de(lw + ' dialog ' + (i + 1), line.de);
            if (!str(line.tr)) err(lw + ' dialog ' + (i + 1), 'tr eksik');

          if (seenWords[w.id]) err(ww, 'aynı ünitede tekrar eden kelime id');
          seenWords[w.id] = true;
          de(ww, w.de);
          if (!str(w.tr)) err(ww, 'tr eksik');
          if (POS.indexOf(w.pos) < 0) err(ww, 'pos şunlardan biri olmalı: ' + POS.join(', '));
          if (w.pos === 'n') {
            if (ARTICLES.indexOf(w.art) < 0) err(ww, 'isimde art der/die/das olmalı');
            if (/^(der|die|das) /i.test(w.de)) err(ww, 'de alanına artikel yazılmaz (art alanında)');
            if (w.de && w.de[0] !== w.de[0].toUpperCase()) err(ww, 'isim büyük harfle başlamalı');
          } else if (w.art) err(ww, 'art sadece isimlerde (pos: n) kullanılır');
          if (w.ex) { de(ww + ' ex', w.ex.de); if (!str(w.ex.tr)) err(ww + ' ex', 'tr eksik'); }
        });

        if (!Array.isArray(l.exercises) || l.exercises.length < 3) err(lw, 'en az 3 alıştırma gerekli');
        (l.exercises || []).forEach(function (ex, i) {
          var ew = lw + ' alıştırma ' + (i + 1) + ' [' + (ex && ex.type) + ']';
          if (EX_TYPES.indexOf(ex.type) < 0) return err(ew, 'bilinmeyen tip; geçerli: ' + EX_TYPES.join(', '));
          if (ex.tags && !Array.isArray(ex.tags)) err(ew, 'tags dizi olmalı');

            case 'mcq':
              if (!str(ex.q)) err(ew, 'q eksik');
              if (!Array.isArray(ex.options) || ex.options.length < 2) err(ew, 'en az 2 seçenek');
              else if (typeof ex.answer !== 'number' || ex.answer < 0 || ex.answer >= ex.options.length) err(ew, 'answer geçerli bir seçenek indeksi olmalı');
              if (ex.de) de(ew, ex.de);
              break;
            case 'type':
              if (!str(ex.tr) && !str(ex.q)) err(ew, 'tr veya q gerekli');
              if (!Array.isArray(ex.answers) || !ex.answers.length) err(ew, 'answers eksik');
              else ex.answers.forEach(function (a) { de(ew, a); });
              break;
            case 'cloze':
              de(ew, ex.de);
              if (str(ex.de) && ex.de.split('___').length !== 2) err(ew, 'de içinde tam olarak bir ___ olmalı');
              if (!Array.isArray(ex.answers) || !ex.answers.length) err(ew, 'answers eksik');
              if (!str(ex.tr)) err(ew, 'tr eksik');
              break;
            case 'order':
              de(ew, ex.answer);
              if (str(ex.answer) && ex.answer.trim().split(/\s+/).length < 2) err(ew, 'answer en az 2 kelime');
              if (!str(ex.tr)) err(ew, 'tr eksik');
              (ex.alt || []).forEach(function (a) { de(ew + ' alt', a); });
              break;
            case 'listen':
              de(ew, ex.de);
              if (!str(ex.tr)) err(ew, 'tr eksik');
              break;
            case 'article':
              if (!str(ex.word)) err(ew, 'word (kelime id) gerekli');
              break;
            case 'match':
              if (!Array.isArray(ex.pairs) || ex.pairs.length < 3) err(ew, 'en az 3 çift');
              else ex.pairs.forEach(function (p) { if (!Array.isArray(p) || p.length !== 2) err(ew, 'her çift [almanca, türkçe]'); else de(ew, p[0]); });
              break;
            case 'speak':
              de(ew, ex.de);
              if (!str(ex.tr)) err(ew, 'tr eksik');
              break;
            case 'write':
              if (!str(ex.task)) err(ew, 'task eksik');
              if (!str(ex.model)) err(ew, 'model (örnek cevap) eksik');
              break;
          }

      });
      return errs;
    },

            var prev = defs[w.id];
            if (prev) errs.push(l.id + ': ' + w.id + ' zaten ' + prev.where + ' içinde tanımlı; tekrar tanımlama, sadece kullan');

        u.lessons.forEach(function (l) {
          (l.exercises || []).forEach(function (ex, i) {
            if (ex.type === 'article') {
              var w = content.words[ex.word];
              if (!w) errs.push(l.id + ' alıştırma ' + (i + 1) + ': article kelimesi bulunamadı: ' + ex.word);
              else if (w.pos !== 'n') errs.push(l.id + ' alıştırma ' + (i + 1) + ': article kelimesi isim değil: ' + ex.word);

<script>/* js/core/answer.js */
// Cevap kontrol motoru: normalize → karşılaştır → teşhis. Saf fonksiyonlar (tests/answer.test.mjs).
//
// Sonuç seviyeleri:
//   exact   — doğru
//   minor   — doğru sayılır, küçük uyarı (ae/oe/ue, tek harflik yazım hatası, isim küçük harf)
//   partial — neredeyse (ör. isimde artikel eksik); öğrenmede "Zor" sayılır
//   wrong   — yanlış; teşhis etiketleri ve açıklama ile
(function (DE) {
  'use strict';

  var ARTICLE_FORMS = ['der', 'die', 'das', 'den', 'dem', 'des', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines',
    'kein', 'keine', 'keinen', 'keinem', 'keiner', 'mein', 'meine', 'meinen', 'meinem', 'meiner',
    'dein', 'deine', 'deinen', 'deinem', 'deiner', 'ihr', 'ihre', 'ihren', 'ihrem', 'ihrer', 'sein', 'seine', 'seinen', 'seinem', 'seiner'];
  var BARE_ARTICLES = ['der', 'die', 'das'];

  // Umlaut'un anlamı değiştirdiği sık çiftler: umlaut'suz yazım burada "yanlış" sayılır.
  var UMLAUT_PAIRS = ['schon', 'bruder', 'mutter', 'vater', 'tochter', 'zahlen', 'drucken', 'konnte', 'wurde', 'musste',
    'hatte', 'ware', 'schwul', 'zahlt', 'fur', 'uber', 'horen', 'konnen', 'mussen', 'durfen', 'mochte'];

  function normalize(s) {

      .normalize('NFC')
      .replace(/[‘’‚‛`´']/g, '')
      .replace(/[“”„«»"]/g, '')

  /** Türkçe klavyeden gelen harfleri Almanca karşılığa yaklaştırır (sadece teşhis için). */

  function levenshtein(a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1);
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {

      var t = prev; prev = cur; cur = t;

  /** Token düzeyinde LCS farkı: [{t, op:'same'|'add'|'del'}] (add = kullanıcı fazladan yazmış, del = eksik). */
  function diff(input, expected) {
    var a = tokens(input), b = tokens(expected);
    var A = a.map(fold), B = b.map(fold);
    var m = a.length, n = b.length, L = [];
    for (var i = 0; i <= m; i++) { L.push(new Array(n + 1).fill(0)); }
    for (i = m - 1; i >= 0; i--) for (var j = n - 1; j >= 0; j--) {
      L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);

    var out = []; i = 0; j = 0;
    while (i < m && j < n) {

    }

    }

    if (fold(i) === fold(e)) {
      res.level = 'minor'; res.tags.push('spelling.umlaut');
      res.notes.push('ä/ö/ü/ß yerine ae/oe/ue/ss yazdın; kabul edildi. Doğrusu: ' + expected);
      return res;
    }

    var ti = tokens(i).map(lower), te = tokens(e).map(lower);
    var fi = ti.map(fold), fe = te.map(fold);

    // İsimde artikel eksik: "Tisch" ↔ "der Tisch"
    if (fe.length === fi.length + 1 && BARE_ARTICLES.indexOf(te[0]) >= 0 && fe.slice(1).join(' ') === fi.join(' ')) {
      res.level = 'partial'; res.tags.push('article.missing');
      res.notes.push('Artikeli unutma: ' + expected + '. Almancada isim artikeliyle birlikte öğrenilir.');
      return res;
    }

    if (fe.length === fi.length) {
      var diffs = [];
      for (k = 0; k < fe.length; k++) if (fe[k] !== fi[k]) diffs.push(k);

      if (diffs.length && diffs.every(function (d) { return ARTICLE_FORMS.indexOf(fe[d]) >= 0 && ARTICLE_FORMS.indexOf(fi[d]) >= 0; })) {
        res.tags.push('article');
        res.notes.push('Artikel/ek yanlış: ' + diffs.map(function (d) { return '"' + ti[d] + '" değil "' + te[d] + '"'; }).join(', ') + '.');

      }

      if (diffs.length === 1) {
        var d = diffs[0], got = ti[d], want = te[d];
        if (stripUmlauts(got) === stripUmlauts(want)) {
          if (UMLAUT_PAIRS.indexOf(stripUmlauts(want)) >= 0) {
            res.tags.push('spelling.umlaut');
            res.notes.push('Umlaut anlamı değiştirir: "' + got + '" değil "' + want + '".');
            return res;
          }
          res.level = 'minor'; res.tags.push('spelling.umlaut');
          res.notes.push('Umlaut eksik: "' + want + '" (noktaları unutma).');
          return res;

        if (/[ışçğ]/.test(got) && fold(deTurk(got)) === fold(want)) {

          res.notes.push('Türkçe harf kullandın: "' + got + '" → "' + want + '". Almancada ş = sch, ı yok.');

          if (!endDiff) {
            res.level = 'minor'; res.tags.push('spelling');
            res.notes.push('Küçük yazım hatası: "' + got + '" → "' + want + '".');
            return res;
          }
        }
        if (got.length > 2 && want.length > 2 && got.slice(0, 3) === want.slice(0, 3)) {
          res.tags.push('verb.conj');
          res.notes.push('Ek/çekim hatası: "' + got + '" değil "' + want + '".');
          return res;
        }
      }
    }

    if (sameMultiset(fi, fe)) {
      res.tags.push('word_order');
      res.notes.push('Kelimeler doğru, sıra yanlış. Ana cümlede çekimli fiil 2. sırada olur.');
      return res;
    }

    return res;
  }

  var RANK = { exact: 3, minor: 2, partial: 1, wrong: 0 };

  /**
   * Birden çok kabul edilen cevaba karşı kontrol; en iyi sonucu döndürür.
   * @returns {{level:string, ok:boolean, expected:string, notes:string[], tags:string[], diff:Array}}
   */
  function check(input, answers, opts) {
    var list = Array.isArray(answers) ? answers : [answers];
    var best = null;
    list.forEach(function (a) {
      var r = compareOne(input, a, opts);
      if (!best || RANK[r.level] > RANK[best.level]) best = r;
    });

    if (!best.ok) {
      // En yakın cevabı göster.
      var closest = list[0], dist = Infinity;
      list.forEach(function (a) { var dd = levenshtein(fold(normalize(input)), fold(normalize(a))); if (dd < dist) { dist = dd; closest = a; } });
      best.expected = best.tags.length ? best.expected : closest;
      best.diff = diff(input, best.expected);
      if (/[ışğ]/.test(input) && best.tags.indexOf('spelling.tr') < 0) best.notes.push('Türkçe harf (ı/ş/ğ) Almancada yok.');
    }
    return best;
  }

  /** Konuşma tanıma sonucu ile hedef cümlenin kelime bazında örtüşmesi (0–1). */

    var d = diff(heard, target);

<script>/* js/core/fsrs.js */
// FSRS-5 aralıklı tekrar algoritması (minimal implementasyon, varsayılan parametreler).
// Kart durumu: { s: stability (gün), d: difficulty (1–10), reps, lapses, last (ms), due (ms) }
// Derece (grade): 1 = Tekrar (Again), 2 = Zor (Hard), 3 = İyi (Good), 4 = Kolay (Easy)
(function (DE) {
  'use strict';

  var W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192,
    1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
  var DECAY = -0.5;
  var FACTOR = Math.pow(0.9, 1 / DECAY) - 1; // 19/81
  var DAY = 86400000;
  var RELEARN_MS = 10 * 60 * 1000;

  var cfg = { retention: 0.9, maxIvl: 365, fuzz: true };

  function clampD(d) { return Math.min(10, Math.max(1, d)); }
  function retrievability(elapsedDays, s) { return Math.pow(1 + FACTOR * elapsedDays / s, DECAY); }
  function initS(g) { return Math.max(W[g - 1], 0.1); }
  function initD(g) { return clampD(W[4] - Math.exp(W[5] * (g - 1)) + 1); }
  function nextD(d, g) {
    var dp = d - W[6] * (g - 3) * (10 - d) / 9;
    return clampD(W[7] * initD(4) + (1 - W[7]) * dp);
  }
  function recallS(d, s, r, g) {
    var hard = g === 2 ? W[15] : 1, easy = g === 4 ? W[16] : 1;
    return s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) * hard * easy);
  }
  function forgetS(d, s, r) {
    var sf = W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]);
    return Math.min(sf, s / Math.exp(W[17] * W[18]));
  }
  function shortS(s, g) { return s * Math.exp(W[17] * (g - 3 + W[18])); }

  /** Hedef hatırlama oranı için gün cinsinden aralık. */
  function intervalDays(s) {
    var ivl = s / FACTOR * (Math.pow(cfg.retention, 1 / DECAY) - 1);
    return Math.min(cfg.maxIvl, Math.max(1, Math.round(ivl)));
  }

  function fuzz(ivl, rnd) {
    if (!cfg.fuzz || ivl < 3) return ivl;
    var r = (rnd || Math.random)();
    return Math.max(1, Math.round(ivl * (0.95 + 0.1 * r)));
  }

  /**
   * Kartı derecelendirir, yeni durumu döndürür (girdiyi değiştirmez).
   * @param {object} card
   * @param {number} g 1–4
   * @param {number} now ms
   */
  function review(card, g, now, rnd) {
    var c = Object.assign({}, card);
    var s, d;
    if (!c.reps) {
      s = initS(g); d = initD(g);
    } else {
      var elapsed = Math.max(0, (now - c.last) / DAY);
      if (elapsed < 1) { s = shortS(c.s, g); }
      else {
        var r = retrievability(elapsed, c.s);
        s = g === 1 ? forgetS(c.d, c.s, r) : recallS(c.d, c.s, r, g);
      }
      d = nextD(c.d, g);
    }
    c.s = Math.max(0.1, s);
    c.d = d;
    c.reps = (c.reps || 0) + 1;
    if (g === 1 && card.reps) c.lapses = (c.lapses || 0) + 1;
    c.last = now;
    c.due = g === 1 ? now + RELEARN_MS : now + fuzz(intervalDays(c.s), rnd) * DAY;
    return c;
  }

  /** Her derece için bir sonraki aralığın önizlemesi (ms). */
  function preview(card, now) {
    return [1, 2, 3, 4].map(function (g) { return review(card, g, now, function () { return 0.5; }).due - now; });
  }

  /** Kartın şu anki hatırlanma olasılığı. */

<script>/* js/core/store.js */

      today: { day: '', minutes: 0 },

        var old = localStorage.getItem(KEY);

        lastPrevSave = Date.now();

      localStorage.setItem(KEY, json);

  /** Tanıma kartı (de-tr) yeterince oturunca üretim kartını (tr-de) aç. */

  }

  function gradeCard(id, g, now) {

      state.mistakes.push({ ts: Date.now(), id: ex.id, q: info.q || '', given: info.given || '', expected: info.expected || '', tags: tags });

<script>/* js/core/planner.js */
// Müfredat ilerlemesi ve "Bugün" planı; ders/test adımlarının üretimi.
(function (DE) {
  'use strict';

  var PASS = 0.8;              // ünite testi geçme eşiği
  var TEST_SIZE = 15;
  var CARDS_PER_MIN = 5;       // tekrar hızı tahmini
  var NEW_LESSON_MIN = { 15: 0, 30: 1, 45: 1, 60: 2 };

  function S() { return DE.store.state; }
  function C() { return DE.content; }

  function lessonDone(id) { var l = S().lessons[id]; return !!(l && l.done); }
  function unitLessonsDone(u) { return u.lessons.every(function (l) { return lessonDone(l.id); }); }
  function unitPassed(u) { var x = S().units[u.id]; return !!(x && x.testPassed); }

  /** 'done' | 'available' | 'locked' (yumuşak kilit: açılabilir ama önerilmez). */
  function lessonStatus(lesson) {
    if (lessonDone(lesson.id)) return 'done';
    var all = C().allLessons();
    var i = all.indexOf(lesson);
    if (i <= 0) return 'available';
    return lessonDone(all[i - 1].id) ? 'available' : 'locked';
  }

  function nextLesson() {
    var all = C().allLessons();
    for (var i = 0; i < all.length; i++) if (!lessonDone(all[i].id)) return all[i];
    return null;
  }

  /** Dersleri bitmiş ama testi geçilmemiş ilk ünite. */
  function pendingTest() {
    var us = C().units;
    for (var i = 0; i < us.length; i++) {
      if (unitLessonsDone(us[i]) && !unitPassed(us[i])) return us[i];
    }
    return null;
  }

  /**
   * Bugünün planı. Sıra: yarım kalan oturum → tekrar → ünite testi → yeni ders.
   * Tekrar borcu bütçenin çok üstündeyse yeni ders önerilmez.
   */
  function today(now) {
    var minutes = DE.store.todayMinutes();
    var due = DE.store.dueCount(now);
    var reviewBudget = Math.max(10, Math.round(minutes * (minutes <= 15 ? 0.8 : 0.35) * CARDS_PER_MIN));
    var steps = [];
    var run = S().run;
    if (run) steps.push({ kind: 'resume', run: run });
    if (due > 0) steps.push({ kind: 'review', count: Math.min(due, reviewBudget), total: due });
    var test = pendingTest();
    if (test && minutes >= 30) steps.push({ kind: 'test', unit: test });
    var next = nextLesson();
    var doneToday = lessonsDoneToday(now);
    var allowed = NEW_LESSON_MIN[minutes] == null ? 1 : NEW_LESSON_MIN[minutes];
    var debtTooHigh = due > reviewBudget * 2;
    if (next && !test && doneToday < allowed && !debtTooHigh) steps.push({ kind: 'lesson', lesson: next });
    return {
      minutes: minutes, due: due, reviewBudget: reviewBudget, steps: steps, next: next,
      blockedByDebt: !!(next && debtTooHigh && !test), lessonsDoneToday: doneToday, allowedLessons: allowed
    };
  }

  function lessonsDoneToday(now) {
    var start = DE.util.startOfDay(now);
    var n = 0;
    Object.keys(S().lessons).forEach(function (k) { if ((S().lessons[k].last || 0) >= start) n++; });
    return n;
  }

  // ---- Otomatik alıştırmalar -------------------------------------------------------------

  /** id → alıştırma nesnesi (otomatik üretilenler dahil). */
  function exerciseById(id) {
    if (id.indexOf('auto:art:') === 0) {
      return { id: id, type: 'article', word: id.slice(9), tags: ['article'] };
    }
    if (id.indexOf('auto:match:') === 0) {
      var ids = id.slice(11).split(',');
      return {
        id: id, type: 'match', tags: ['vocab'],
        pairs: ids.map(function (w) { var x = C().words[w]; return x ? [(x.art ? x.art + ' ' : '') + x.de, x.tr] : null; }).filter(Boolean)
      };
    }
    var lessonId = id.replace(/\.e\d+$/, '');
    var l = C().lessonById[lessonId];
    if (!l) return null;
    for (var i = 0; i < l.exercises.length; i++) if (l.exercises[i].id === id) return l.exercises[i];
    return null;
  }

  /** Ders adımları: giriş/diyalog → kelimeler → gramer → alıştırmalar → kültür → özet. */
  function lessonSteps(lesson) {
    var steps = [];
    if (lesson.intro || lesson.dialog) steps.push({ k: 'intro' });
    (lesson.words || []).forEach(function (w) { steps.push({ k: 'word', id: w.id }); });
    (lesson.grammar || []).forEach(function (g, i) { steps.push({ k: 'grammar', i: i }); });

    var words = lesson.words || [];
    // Eşleştirme: anlamı karıştırılmayacak kelimelerle 4–6'lık gruplar.
    var forMatch = words.filter(function (w) { return w.pos !== 'num'; });
    for (var i = 0; i + 3 <= forMatch.length; i += 6) {
      var group = forMatch.slice(i, i + 6);
      if (group.length >= 3) steps.push({ k: 'ex', id: 'auto:match:' + group.map(function (w) { return w.id; }).join(',') });
    }
    var authoredArt = {};
    lesson.exercises.forEach(function (e) { if (e.type === 'article') authoredArt[e.word] = true; });
    words.forEach(function (w) { if (w.pos === 'n' && w.artQuiz !== false && !authoredArt[w.id]) steps.push({ k: 'ex', id: 'auto:art:' + w.id }); });
    lesson.exercises.forEach(function (e) { steps.push({ k: 'ex', id: e.id }); });

    if (lesson.culture) steps.push({ k: 'culture' });
    return steps;
  }

  /** Ünite testi: ünitenin otomatik puanlanan alıştırmalarından rastgele örneklem. */
  function testSteps(unit, rnd) {
    var pool = [];
    unit.lessons.forEach(function (l) {
      l.exercises.forEach(function (e) {
        if (['speak', 'write', 'match'].indexOf(e.type) < 0) pool.push(e.id);
      });
      (l.words || []).forEach(function (w) { if (w.pos === 'n' && w.artQuiz !== false) pool.push('auto:art:' + w.id); });
    });
    // Ders başına dengeli dağılım için önce karıştır, sonra kes.
    return DE.util.sample(pool, Math.min(TEST_SIZE, pool.length), rnd).map(function (id) { return { k: 'ex', id: id }; });
  }

  DE.planner = {
    PASS: PASS, lessonStatus: lessonStatus, lessonDone: lessonDone, unitLessonsDone: unitLessonsDone, unitPassed: unitPassed,
    nextLesson: nextLesson, pendingTest: pendingTest, today: today, exerciseById: exerciseById,
    lessonSteps: lessonSteps, testSteps: testSteps
  };
})(typeof window !== 'undefined' ? (window.DE = window.DE || {}) : (globalThis.DE = globalThis.DE || {}));

</script>
<script>/* js/core/audio.js */
// Ses: Almanca seslendirme (Web Speech API), konuşma tanıma (Chrome/Edge) ve mikrofon kaydı.
// Önceden üretilmiş ses dosyaları eklendiğinde DE.audio.files (metin → yol) üzerinden öncelikli çalınır.
(function (DE) {
  'use strict';

  var synth = typeof speechSynthesis !== 'undefined' ? speechSynthesis : null;

      var v = pickVoice();

  }

  /** Küçük "çal" butonu. */
  function button(text, opts) {
    opts = opts || {};

    var wrap = h('span.play');
    wrap.appendChild(h('button.btn-icon', { title: 'Dinle', type: 'button', onclick: function (e) { e.stopPropagation(); speak(text); } }, '🔊'));
    if (opts.slow !== false) wrap.appendChild(h('button.btn-icon.slow', { title: 'Yavaş dinle', type: 'button', onclick: function (e) { e.stopPropagation(); speak(text, { slow: true }); } }, '🐢'));

      r.interimResults = false;
      r.maxAlternatives = 3;
      var done = false;
      r.onresult = function (e) {

      };
      r.onerror = function (e) { if (!done) { done = true; reject(new Error(e.error === 'not-allowed' ? 'Mikrofon izni verilmedi.' : e.error === 'network' ? 'Konuşma tanıma için internet gerekli.' : 'Tanıma hatası: ' + e.error)); } };

})(window.DE = window.DE || {});

<script>/* js/ai/prompt.js */
// "Yapay zekâya sor": belirli bir servise bağlı olmadan, hazır istemi panoya kopyalar ve
// kullanıcının seçtiği sohbet sitesini açar. Servis listesi Ayarlar'dan düzenlenir.

(function (DE) {
  'use strict';

  var MAX_URL_Q = 1800;

    return u ? u.level + ' (Ünite ' + u.order + ': ' + u.title + ')' : 'A1';
  }

  function writePrompt(o) {
    return [
      'Ben Almanca öğrenen bir Türk\'üm (İngilizce de biliyorum). Seviyem: ' + o.level + '.',
      'Görev: "' + o.task + '"',
      'Metnim:',
      '<<<',
      o.text,
      '>>>',
      'Lütfen:',
      '1) Hataları tek tek göster ve her birini Türkçe kısaca açıkla (hangi kural?).',
      '2) Düzeltilmiş tam metni ver.',
      '3) Aynı seviyede daha doğal bir alternatif öner.',
      'Benim seviyemin üstündeki gramer yapılarını kullanma. Cevabın kısa olsun.'
    ].join('\n');
  }

  function rolePrompt(o) {
    return [
      'Benimle Almanca bir rol yapma pratiği yap. Seviyem: ' + o.level + '. Ana dilim Türkçe.',
      'Senaryo: ' + o.scenario,
      'Kurallar: Sadece bu seviyedeki basit Almanca cümleler kur. Her seferinde tek bir kısa replik söyle ve benim cevabımı bekle.',
      'Ben hata yaparsam, cevabının sonunda parantez içinde Türkçe kısa bir düzeltme ekle.',
      'Ben "Ende" yazınca bitir ve en sık yaptığım 3 hatayı Türkçe özetle.',
      'İlk repliği sen söyle.'
    ].join('\n');
  }

  function explainPrompt(o) {
    return [
      'Almanca öğreniyorum (seviye ' + o.level + ', ana dilim Türkçe). Bir alıştırmada hata yaptım, nedenini anlamadım.',
      'Soru: ' + o.q,
      'Benim cevabım: ' + o.given,
      'Doğru cevap: ' + o.expected,
      'Neden böyle olduğunu Türkçe, kısaca ve 2–3 örnek cümleyle açıklar mısın?'
    ].join('\n');
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* yok say */ }
    ta.remove();
  }

  function urlFor(service, prompt) {
    var q = encodeURIComponent(prompt);
    if (service.url.indexOf('{q}') >= 0) {
      return q.length <= MAX_URL_Q ? service.url.replace('{q}', q) : service.url.replace(/[?&][^?&]*\{q\}.*/, '');
    }
    return service.url;
  }

  /** İstem + servis butonları olan küçük panel. */
  function panel(prompt, label) {
    var h = DE.util.h;
    var services = DE.store.state.settings.ai || [];
    var status = h('div.muted.small');

      h('div.row.wrap', services.map(function (s) {
        return h('button.btn', {
          type: 'button',
          onclick: function () {
            copy(prompt).then(function () { status.textContent = '✓ İstem kopyalandı. ' + s.name + ' açılıyor…'; });
            window.open(urlFor(s, prompt), '_blank', 'noopener');
          }
        }, s.name);
      }), h('button.btn.ghost', { type: 'button', onclick: function () { copy(prompt).then(function () { status.textContent = '✓ İstem kopyalandı.'; }); } }, '📋 Sadece kopyala')),
      status,
      h('details', h('summary.small', 'İstemi göster'), h('pre.prompt', prompt))
    );
    return box;
  }

  DE.ai = { levelOf: levelOf, writePrompt: writePrompt, rolePrompt: rolePrompt, explainPrompt: explainPrompt, panel: panel, copy: copy, urlFor: urlFor };
})(window.DE = window.DE || {});

</script>
